<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>圖片管理｜歲悅長照集團</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/admin/admin.css" />
  </head>
  <body class="admin-app-page">
    <div class="admin-app-shell" hidden>
      <aside class="admin-sidebar">
        <div class="admin-sidebar-head">
          <a class="admin-brand" href="/">
            <img src="/assets/company-logo.png" alt="" />
            <span>
              <strong>歲悅長照集團</strong>
              <small>CMS Console</small>
            </span>
          </a>
        </div>
        <nav class="admin-menu" aria-label="後台選單">
          <a href="/admin"><span>DB</span><strong>Dashboard</strong></a>
          <a href="/admin/pages"><span>PG</span><strong>頁面管理</strong></a>
          <a class="active" href="/admin/media"><span>IM</span><strong>圖片管理</strong></a>
          <a href="/admin/articles"><span>AR</span><strong>文章管理</strong></a>
          <a href="/admin/categories"><span>CT</span><strong>分類管理</strong></a>
        </nav>
        <div class="admin-sidebar-note">
          <span>Media Library</span>
          <strong>圖片與素材管理</strong>
          <p>上傳圖片至 Supabase Storage，並同步寫入 media 資料表。</p>
        </div>
      </aside>

      <main class="admin-main">
        <header class="admin-topbar">
          <div class="admin-topbar-title">
            <p class="admin-eyebrow">Assets</p>
            <h1>圖片管理</h1>
            <span>管理圖片上傳、預覽、URL 與媒體資料。</span>
          </div>
          <div class="admin-topbar-actions">
            <a class="admin-preview-link" href="/" target="_blank" rel="noopener">查看前台</a>
            <div class="admin-userbox">
              <b id="adminUserInitial">S</b>
              <span>
                <small>登入者</small>
                <strong id="adminUserEmail">正在確認登入狀態...</strong>
              </span>
              <button id="adminLogout" type="button">登出</button>
            </div>
          </div>
        </header>

        <section class="admin-workspace-panel admin-media-upload-panel">
          <div class="admin-workspace-head">
            <div>
              <p class="admin-eyebrow">Upload</p>
              <h2>上傳圖片</h2>
            </div>
            <button type="submit" form="adminMediaUploadForm">上傳圖片</button>
          </div>
          <form id="adminMediaUploadForm" class="admin-form-grid">
            <label>
              <span>圖片檔案</span>
              <input type="file" name="file" accept="image/*" required />
            </label>
            <label>
              <span>替代文字 Alt text</span>
              <input type="text" name="alt_text" placeholder="例如：歲悅長照服務情境" />
            </label>
            <label class="admin-field-wide">
              <span>圖片說明</span>
              <input type="text" name="caption" placeholder="可選填，方便後台搜尋與管理" />
            </label>
          </form>
          <div id="adminMediaStatus" class="admin-data-status">等待上傳或讀取媒體庫...</div>
        </section>

        <section class="admin-workspace-panel admin-media-panel">
          <div class="admin-workspace-head">
            <div>
              <p class="admin-eyebrow">Library</p>
              <h2>圖片列表</h2>
            </div>
            <button type="button" id="adminRefreshMedia">重新整理</button>
          </div>
          <div id="adminMediaGrid" class="admin-media-grid" aria-live="polite"></div>
        </section>
      </main>
    </div>

    <div id="adminLoading" class="admin-loading">
      <strong>正在檢查登入狀態</strong>
      <span>請稍候...</span>
    </div>

    <script type="module" src="/src/admin/media.js"></script>
  </body>
</html>
