<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>檔案下載管理｜歲悅長照集團</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/admin/admin.css" />
  </head>
  <body class="admin-app-page">
    <div class="admin-app-shell" hidden>
      <aside class="admin-sidebar">
        <div class="admin-sidebar-head">
          <a class="admin-brand" href="/"><img src="/assets/company-logo.png" alt="" /><span><strong>歲悅長照集團</strong><small>CMS Console</small></span></a>
        </div>
        <nav class="admin-menu" aria-label="後台選單">
          <a href="/admin"><span>DB</span><strong>Dashboard</strong></a>
          <a href="/admin/pages"><span>PG</span><strong>頁面管理</strong></a>
          <a href="/admin/media"><span>IM</span><strong>圖片管理</strong></a>
          <a href="/admin/courses"><span>CS</span><strong>課程管理</strong></a>
          <a class="active" href="/admin/files"><span>DL</span><strong>檔案下載</strong></a>
          <a href="/admin/forms"><span>FM</span><strong>表單資料</strong></a>
          <a href="/admin/articles"><span>AR</span><strong>文章管理</strong></a>
          <a href="/admin/categories"><span>CT</span><strong>分類管理</strong></a>
          <a href="/admin/traffic"><span>AN</span><strong>網站流量中心</strong></a>
          <a href="/admin/content-health"><span>QA</span><strong>內容健康檢查</strong></a>
        </nav>
        <div class="admin-sidebar-note"><span>Downloads</span><strong>文件庫</strong><p>管理投資人文件、課程簡章、股東會資料與表單檔案。</p></div>
      </aside>

      <main class="admin-main">
        <header class="admin-topbar">
          <div class="admin-topbar-title">
            <p class="admin-eyebrow">Files</p>
            <h1>檔案下載管理</h1>
            <span>上傳 PDF / Excel / Word，前台可用固定模板讀取文件資料。</span>
          </div>
          <div class="admin-topbar-actions">
            <a class="admin-preview-link" href="/#investors" target="_blank" rel="noopener">查看投資人專區</a>
            <div class="admin-userbox"><b id="adminUserInitial">S</b><span><small>登入者</small><strong id="adminUserEmail">正在確認登入狀態...</strong></span><button id="adminLogout" type="button">登出</button></div>
          </div>
        </header>

        <div id="adminFilesStatus" class="admin-data-status">正在讀取檔案...</div>

        <section class="admin-editor-layout">
          <section class="admin-workspace-panel">
            <div class="admin-workspace-head">
              <div><p class="admin-eyebrow">File Form</p><h2 id="fileFormTitle">新增檔案</h2></div>
              <button type="button" id="newFileButton">清空新增</button>
            </div>
            <form id="fileEditorForm" class="admin-form-grid">
              <input type="hidden" name="id" />
              <input type="hidden" name="bucket" />
              <input type="hidden" name="storage_path" />
              <input type="hidden" name="file_name" />
              <input type="hidden" name="mime_type" />
              <input type="hidden" name="size_bytes" />
              <label><span>檔案標題</span><input name="title" type="text" required /></label>
              <label><span>Slug</span><input name="slug" type="text" required /></label>
              <label><span>分類</span><select name="category"><option value="investor">投資人文件</option><option value="finance">財務資訊</option><option value="governance">公司治理</option><option value="shareholder">股東專區</option><option value="course">課程簡章</option><option value="form">表單文件</option><option value="general">一般文件</option></select></label>
              <label><span>檔案類型</span><select name="file_type"><option>PDF</option><option>Excel</option><option>Word</option><option>Image</option><option>Other</option></select></label>
              <label class="admin-field-wide"><span>說明</span><textarea name="description" rows="4"></textarea></label>
              <label><span>排序</span><input name="sort_order" type="number" value="0" /></label>
              <label><span>發布狀態</span><select name="status"><option value="draft">草稿</option><option value="published">已發布</option><option value="archived">封存</option></select></label>
              <label class="admin-toggle-field"><input name="is_featured" type="checkbox" /><span>重點文件</span></label>
              <label class="admin-toggle-field"><input name="is_enabled" type="checkbox" checked /><span>啟用</span></label>
              <label class="admin-toggle-field"><input name="is_public" type="checkbox" checked /><span>允許前台顯示</span></label>
              <label class="admin-field-wide"><span>上傳檔案</span><input name="file" type="file" accept=".pdf,.xlsx,.xls,.doc,.docx,image/*" /></label>
              <p id="fileCurrentInfo" class="admin-data-status" hidden></p>
              <button type="submit">儲存檔案</button>
            </form>
          </section>

          <section class="admin-workspace-panel">
            <div class="admin-workspace-head">
              <div><p class="admin-eyebrow">File List</p><h2>檔案列表</h2></div>
              <button type="button" id="refreshFilesButton">重新整理</button>
            </div>
            <div class="admin-table-wrap">
              <table class="admin-data-table admin-article-table">
                <thead><tr><th>檔案</th><th>分類</th><th>狀態</th><th>更新</th><th>操作</th></tr></thead>
                <tbody id="filesTableBody"></tbody>
              </table>
            </div>
          </section>
        </section>
      </main>
    </div>
    <div id="adminLoading" class="admin-loading"><strong>正在檢查登入狀態</strong><span>請稍候...</span></div>
    <script type="module" src="/src/admin/files.js"></script>
  </body>
</html>
