<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>模板欄位管理｜歲悅長照集團</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/admin/admin.css" />
  </head>
  <body class="admin-app-page">
    <div class="admin-app-shell" hidden>
      <aside class="admin-sidebar">
        <div class="admin-sidebar-head">
          <a class="admin-brand" href="/"><img src="/assets/company-logo.png" alt="" /><span><strong>歲悅長照集團</strong><small>CMS Console</small></span></a>
        </div>
        <nav class="admin-menu" aria-label="後台選單">
          <a href="/admin"><span>DB</span><strong>Dashboard</strong></a>
          <a href="/admin/pages"><span>PG</span><strong>頁面管理</strong></a>
          <a href="/admin/home-modules"><span>HM</span><strong>首頁模組</strong></a>
          <a class="active" href="/admin/template-fields"><span>TF</span><strong>模板欄位</strong></a>
          <a href="/admin/media"><span>IM</span><strong>圖片管理</strong></a>
          <a href="/admin/courses"><span>CS</span><strong>課程管理</strong></a>
          <a href="/admin/files"><span>DL</span><strong>檔案下載</strong></a>
          <a href="/admin/forms"><span>FM</span><strong>表單資料</strong></a>
          <a href="/admin/articles"><span>AR</span><strong>文章管理</strong></a>
          <a href="/admin/categories"><span>CT</span><strong>分類管理</strong></a>
          <a href="/admin/governance"><span>GV</span><strong>發布與權限</strong></a>
          <a href="/admin/traffic"><span>AN</span><strong>網站流量中心</strong></a>
          <a href="/admin/content-health"><span>QA</span><strong>內容健康檢查</strong></a>
        </nav>
        <div class="admin-sidebar-note"><span>Template Fields</span><strong>固定欄位</strong><p>服務/招募頁的安全欄位，避免員工改壞版型。</p></div>
      </aside>
      <main class="admin-main">
        <header class="admin-topbar">
          <div class="admin-topbar-title"><p class="admin-eyebrow">Templates</p><h1>服務/招募頁固定模板欄位</h1><span>管理 Hero 標題、內文、固定圖片等欄位，不提供自由排版。</span></div>
          <div class="admin-topbar-actions"><a class="admin-preview-link" href="/#services" target="_blank" rel="noopener">查看服務頁</a><div class="admin-userbox"><b id="adminUserInitial">S</b><span><small>登入者</small><strong id="adminUserEmail">正在確認登入狀態...</strong></span><button id="adminLogout" type="button">登出</button></div></div>
        </header>
        <div id="templateFieldsStatus" class="admin-data-status">正在讀取模板欄位...</div>
        <section class="admin-workspace-panel">
          <div class="admin-workspace-head"><div><p class="admin-eyebrow">Filter</p><h2>選擇頁面</h2></div><button id="refreshTemplateFieldsButton" type="button">重新整理</button></div>
          <div class="admin-form-grid">
            <label><span>頁面</span><select id="templatePageFilter"><option value="">全部</option><option value="about">關於歲悅</option><option value="milestones">大記事</option><option value="home-care">居家照顧</option><option value="day-care">日間照顧</option><option value="community">社區據點</option><option value="nursing">護理復能</option><option value="migrant-training">移工培訓</option><option value="quality">教育品管</option><option value="talent">人才招募</option><option value="land">土地招募</option><option value="investor-recruiting">投資人招募</option></select></label>
          </div>
        </section>
        <section id="templateFieldsList" class="admin-section-editor-list"></section>
      </main>
    </div>
    <div id="adminLoading" class="admin-loading"><strong>正在檢查登入狀態</strong><span>請稍候...</span></div>
    <script type="module" src="/src/admin/template-fields.js"></script>
  </body>
</html>
