<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="awgs-diagnosis-title awgs-diagnosis-desc">
  <title id="awgs-diagnosis-title">AWGS 2025 肌少症診斷核心</title>
  <desc id="awgs-diagnosis-desc">分開說明低肌力、低肌肉量與功能結果。</desc>
  <rect width="1200" height="675" fill="#fffaf3"/>
  <rect width="18" height="675" fill="#f58a1f"/>
  <text x="64" y="62" fill="#f58a1f" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="18" font-weight="850">AWGS 2025</text>
  <text x="64" y="112" fill="#3c1f0b" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="38" font-weight="900">低肌力 + 低肌肉量，才進入正式診斷</text>
  <text x="64" y="151" fill="#725b4c" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="20" font-weight="650">亞洲 2025 共識把走路速度與起立表現視為功能結果，不再單獨取代握力。</text>
  <rect x="64" y="205" width="510" height="374" rx="8" fill="#e7f6f8" stroke="#1595a8" stroke-width="2"/>
    <text x="319" y="255" text-anchor="middle" fill="#1595a8" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="27" font-weight="900">診斷核心｜兩項都低</text>
    <rect x="92" y="286" width="454" height="66" rx="8" fill="#ffffff"/><text x="114" y="314" text-anchor="start" fill="#3c1f0b" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="17" font-weight="800"><tspan x="114" dy="0">肌力：標準化握力測量</tspan></text><rect x="92" y="372" width="454" height="66" rx="8" fill="#ffffff"/><text x="114" y="400" text-anchor="start" fill="#3c1f0b" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="17" font-weight="800"><tspan x="114" dy="0">肌肉量：DXA、BIA、CT 或 MRI</tspan></text><rect x="92" y="458" width="454" height="66" rx="8" fill="#ffffff"/><text x="114" y="486" text-anchor="start" fill="#3c1f0b" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="17" font-weight="800"><tspan x="114" dy="0">50–64 歲與 65 歲以上採分齡門檻</tspan></text><rect x="626" y="205" width="510" height="374" rx="8" fill="#fce9e4" stroke="#d95f45" stroke-width="2"/>
    <text x="881" y="255" text-anchor="middle" fill="#d95f45" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="27" font-weight="900">功能結果｜追蹤影響</text>
    <rect x="654" y="286" width="454" height="66" rx="8" fill="#ffffff"/><text x="676" y="314" text-anchor="start" fill="#3c1f0b" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="17" font-weight="800"><tspan x="676" dy="0">五次坐站所需時間</tspan></text><rect x="654" y="372" width="454" height="66" rx="8" fill="#ffffff"/><text x="676" y="400" text-anchor="start" fill="#3c1f0b" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="17" font-weight="800"><tspan x="676" dy="0">六公尺平常步速</tspan></text><rect x="654" y="458" width="454" height="66" rx="8" fill="#ffffff"/><text x="676" y="486" text-anchor="start" fill="#3c1f0b" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="17" font-weight="800"><tspan x="676" dy="0">SPPB 與真實生活活動能力</tspan></text>
  <line x1="64" y1="620" x2="1136" y2="620" stroke="#ead8bf" stroke-width="2"/>
  <text x="64" y="650" fill="#725b4c" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="16" font-weight="650">數值需依年齡、性別、儀器與測量方法解讀；請由受訓人員完成。</text>
</svg>