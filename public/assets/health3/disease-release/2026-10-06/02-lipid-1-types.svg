<svg role="img" viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" width="900" height="600"><desc>圖解｜不同血脂項目不能混成單一好壞判斷。</desc><title>血脂檢查常見項目</title><rect width="900" height="600" rx="28" fill="#E8EEF5"/><text x="60" y="92" font-size="38" font-weight="700" fill="#8C431B">血脂檢查常見項目</text><text x="60" y="135" font-size="20" fill="#6B574A">歲悅長照｜原創圖解</text><rect x="75" y="190" width="750" height="68" rx="16" fill="white"/><circle cx="112" cy="224" r="18" fill="#E87832"/><text x="112" y="231" text-anchor="middle" font-size="18" fill="white">1</text><text x="150" y="233" font-size="25" fill="#513C32">低密度脂蛋白膽固醇</text><rect x="75" y="282" width="750" height="68" rx="16" fill="white"/><circle cx="112" cy="316" r="18" fill="#E87832"/><text x="112" y="231" text-anchor="middle" font-size="18" fill="white">2</text><text x="150" y="233" font-size="25" fill="#513C32">高密度脂蛋白膽固醇</text><rect x="75" y="374" width="750" height="68" rx="16" fill="white"/><circle cx="112" cy="408" r="18" fill="#E87832"/><text x="112" y="231" text-anchor="middle" font-size="18" fill="white">3</text><text x="150" y="233" font-size="25" fill="#513C32">三酸甘油脂</text></svg>