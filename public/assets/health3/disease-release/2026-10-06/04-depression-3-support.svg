<svg role="img" viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" width="900" height="600"><desc>圖解｜規律、小步驟、連結與持續治療。</desc><title>日常支持四原則</title><rect width="900" height="600" rx="28" fill="#E8EEF5"/><text x="60" y="92" font-size="38" font-weight="700" fill="#8C431B">日常支持四原則</text><text x="60" y="135" font-size="20" fill="#6B574A">歲悅長照｜原創圖解</text><rect x="75" y="190" width="750" height="68" rx="16" fill="white"/><circle cx="112" cy="224" r="18" fill="#E87832"/><text x="112" y="231" text-anchor="middle" font-size="18" fill="white">1</text><text x="150" y="233" font-size="25" fill="#513C32">規律但不逼迫</text><rect x="75" y="282" width="750" height="68" rx="16" fill="white"/><circle cx="112" cy="316" r="18" fill="#E87832"/><text x="112" y="231" text-anchor="middle" font-size="18" fill="white">2</text><text x="150" y="233" font-size="25" fill="#513C32">小步驟恢復活動</text><rect x="75" y="374" width="750" height="68" rx="16" fill="white"/><circle cx="112" cy="408" r="18" fill="#E87832"/><text x="112" y="231" text-anchor="middle" font-size="18" fill="white">3</text><text x="150" y="233" font-size="25" fill="#513C32">傾聽而不責備</text></svg>