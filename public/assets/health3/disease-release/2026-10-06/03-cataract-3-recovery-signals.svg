<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200" viewBox="0 0 800 1200" role="img" aria-labelledby="title desc"><title id="title">白內障術後求助時機</title><desc id="desc">突然看不見、劇烈眼痛、出現新閃光大量飛蚊或黑幕立即就醫；持續惡化當日聯絡團隊；逐漸改善仍依醫囑與回診。</desc><rect width="800" height="1200" fill="#fffaf5"/><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif">
<rect x="36" y="32" width="78" height="8" rx="22" fill="#ce6328"/>
<text x="36" y="100" font-size="46" font-weight="700" fill="#3e3029">白內障術後：何時求助？</text>
<text x="36" y="152" font-size="30" font-weight="400" fill="#695b54">觀察症狀變化，警訊不要等原回診日</text>
<rect x="36" y="190" width="728" height="300" rx="22" fill="#fff0ed"/>
<rect x="36" y="190" width="9" height="300" rx="22" fill="#a9372d"/>
<text x="68" y="246" font-size="38" font-weight="700" fill="#a9372d">立即就醫</text>
<text x="68" y="301" font-size="34" font-weight="400" fill="#3e3029">突然看不見、劇烈眼痛</text>
<text x="68" y="349" font-size="34" font-weight="400" fill="#3e3029">新閃光、大量飛蚊或黑幕</text>
<text x="68" y="397" font-size="34" font-weight="400" fill="#3e3029">突然模糊，也要立即尋求評估</text>
<text x="68" y="445" font-size="34" font-weight="400" fill="#3e3029">不自行開車；必要時撥 119</text>
<rect x="36" y="512" width="728" height="254" rx="22" fill="#fff0dc"/>
<rect x="36" y="512" width="9" height="254" rx="22" fill="#ce6328"/>
<text x="68" y="568" font-size="38" font-weight="700" fill="#ce6328">當日聯絡手術團隊</text>
<text x="68" y="623" font-size="34" font-weight="400" fill="#3e3029">疼痛或紅眼加重、視力變差</text>
<text x="68" y="671" font-size="34" font-weight="400" fill="#3e3029">聯絡不到且惡化時，前往</text>
<text x="68" y="719" font-size="34" font-weight="400" fill="#3e3029">有眼科支援的醫院評估</text>
<rect x="36" y="788" width="728" height="254" rx="22" fill="#eaf4ef"/>
<rect x="36" y="788" width="9" height="254" rx="22" fill="#266c67"/>
<text x="68" y="844" font-size="38" font-weight="700" fill="#266c67">逐步改善，也依醫囑照顧</text>
<text x="68" y="899" font-size="34" font-weight="400" fill="#3e3029">輕微流淚、異物感或模糊</text>
<text x="68" y="947" font-size="34" font-weight="400" fill="#3e3029">應逐步改善；若有疑慮先詢問</text>
<text x="68" y="995" font-size="34" font-weight="400" fill="#3e3029">持續點藥與回診，不自行解禁</text>
<text x="36" y="1108" font-size="30" font-weight="400" fill="#695b54">不是自我診斷表，也不能保證恢復正常。</text>
<text x="36" y="1155" font-size="28" font-weight="400" fill="#695b54">原創衛教資訊圖｜依個別醫療指示照護</text>
</g></svg>