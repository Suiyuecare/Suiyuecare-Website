<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-labelledby="title desc"><title id="title">青光眼治療選項：藥物、雷射與手術</title><desc id="desc">醫師依青光眼種類、眼壓及視神經變化決定；眼藥水｜依處方規律使用；雷射｜協助眼內液體排出；手術｜必要時建立排液通路</desc><rect width="900" height="100%" fill="#FFF9F2"/><text x="48" y="76" font-family="sans-serif" font-size="36" font-weight="700" fill="#703B20">青光眼治療選項：藥物、雷射與手術</text><text x="48" y="122" font-family="sans-serif" font-size="22" fill="#694E3D">醫師依青光眼種類、眼壓及視神經變化決定</text><rect x="44" y="160" width="812" height="72" rx="18" fill="#FFFFFF" stroke="#EBD7C6"/><circle cx="88" cy="196" r="23" fill="#F17A36"/><text x="88" y="204" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">1</text><text x="130" y="205" font-family="sans-serif" font-size="26" fill="#563D2E">眼藥水｜依處方規律使用</text><rect x="44" y="250" width="812" height="72" rx="18" fill="#FFFFFF" stroke="#EBD7C6"/><circle cx="88" cy="286" r="23" fill="#E96A24"/><text x="88" y="294" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">2</text><text x="130" y="295" font-family="sans-serif" font-size="26" fill="#563D2E">雷射｜協助眼內液體排出</text><rect x="44" y="340" width="812" height="72" rx="18" fill="#FFFFFF" stroke="#EBD7C6"/><circle cx="88" cy="376" r="23" fill="#D8591E"/><text x="88" y="384" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">3</text><text x="130" y="385" font-family="sans-serif" font-size="26" fill="#563D2E">手術｜必要時建立排液通路</text></svg>