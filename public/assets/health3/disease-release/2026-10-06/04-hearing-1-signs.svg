<svg role="img" xmlns="http://www.w3.org/2000/svg" width="900" height="456" viewBox="0 0 900 456"><desc>圖解｜背景噪音越多，理解語句通常越困難。</desc><title>常見聽力變化</title><rect width="900" height="456" fill="#FFF8F0"/><text x="45" y="70" font-family="sans-serif" font-size="36" font-weight="700" fill="#8B411B">常見聽力變化</text><rect x="45" y="115" width="810" height="70" rx="18" fill="white" stroke="#E8CDB7"/><circle cx="87" cy="150" r="23" fill="#ED762F"/><text x="87" y="158" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="white">1</text><text x="130" y="159" font-family="sans-serif" font-size="27" fill="#4F3D31">電話內容越來越難聽懂</text><rect x="45" y="207" width="810" height="70" rx="18" fill="white" stroke="#E8CDB7"/><circle cx="87" cy="242" r="23" fill="#ED762F"/><text x="87" y="250" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="white">2</text><text x="130" y="251" font-family="sans-serif" font-size="27" fill="#4F3D31">多人說話或背景吵雜時跟不上</text><rect x="45" y="299" width="810" height="70" rx="18" fill="white" stroke="#E8CDB7"/><circle cx="87" cy="334" r="23" fill="#ED762F"/><text x="87" y="342" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="white">3</text><text x="130" y="343" font-family="sans-serif" font-size="27" fill="#4F3D31">電視音量比家人需要的更大</text></svg>