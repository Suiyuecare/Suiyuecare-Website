<svg xmlns="http://www.w3.org/2000/svg" width="900" height="550" viewBox="0 0 900 550" role="img" aria-labelledby="title desc"><title id="title">回診可帶的四項資訊</title><desc id="desc">治療後仍需追蹤眼壓及視功能；實際用藥時間與漏藥情形；眼紅、刺痛、呼吸或心跳變化；新出現的視力與視野困擾；下一次眼壓與視野檢查日期</desc><rect width="900" height="100%" fill="#FFF9F2"/><text x="48" y="76" font-family="sans-serif" font-size="36" font-weight="700" fill="#703B20">回診可帶的四項資訊</text><text x="48" y="122" font-family="sans-serif" font-size="22" fill="#694E3D">治療後仍需追蹤眼壓及視功能</text><rect x="44" y="160" width="812" height="72" rx="18" fill="#FFFFFF" stroke="#EBD7C6"/><circle cx="88" cy="196" r="23" fill="#F17A36"/><text x="88" y="204" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">1</text><text x="130" y="205" font-family="sans-serif" font-size="26" fill="#563D2E">實際用藥時間與漏藥情形</text><rect x="44" y="250" width="812" height="72" rx="18" fill="#FFFFFF" stroke="#EBD7C6"/><circle cx="88" cy="286" r="23" fill="#E96A24"/><text x="88" y="294" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">2</text><text x="130" y="295" font-family="sans-serif" font-size="26" fill="#563D2E">眼紅、刺痛、呼吸或心跳變化</text><rect x="44" y="340" width="812" height="72" rx="18" fill="#FFFFFF" stroke="#EBD7C6"/><circle cx="88" cy="376" r="23" fill="#D8591E"/><text x="88" y="384" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">3</text><text x="130" y="385" font-family="sans-serif" font-size="26" fill="#563D2E">新出現的視力與視野困擾</text><rect x="44" y="430" width="812" height="72" rx="18" fill="#FFFFFF" stroke="#EBD7C6"/><circle cx="88" cy="466" r="23" fill="#A74922"/><text x="88" y="474" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">4</text><text x="130" y="475" font-family="sans-serif" font-size="26" fill="#563D2E">下一次眼壓與視野檢查日期</text></svg>