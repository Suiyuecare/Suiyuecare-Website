<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1240" viewBox="0 0 800 1240" role="img" aria-labelledby="title desc"><title id="title">青光眼介紹：眼科求助路徑</title><desc id="desc">突發視力喪失或劇烈眼痛須立即就醫；逐漸視力變化安排眼科；沒有症狀但具有年齡、家族史等風險仍須與醫師討論檢查。</desc><rect width="800" height="1240" fill="#fffaf5"/><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif">
<rect x="36" y="32" width="78" height="8" rx="22" fill="#ce6328"/>
<text x="36" y="100" font-size="46" font-weight="700" fill="#3e3029">眼睛有變化：怎麼安排？</text>
<text x="36" y="152" font-size="30" font-weight="400" fill="#695b54">不必先確定病名，才開始尋求協助</text>
<rect x="36" y="194" width="728" height="300" rx="22" fill="#fff0ed"/>
<rect x="36" y="194" width="9" height="300" rx="22" fill="#a9372d"/>
<text x="68" y="250" font-size="38" font-weight="700" fill="#a9372d">突發警訊 → 立即就醫</text>
<text x="68" y="305" font-size="34" font-weight="400" fill="#3e3029">突然看不見，即使沒有眼痛</text>
<text x="68" y="353" font-size="34" font-weight="400" fill="#3e3029">或突然劇痛、紅眼、模糊</text>
<text x="68" y="401" font-size="34" font-weight="400" fill="#3e3029">可能伴光暈、頭痛、噁心嘔吐</text>
<text x="68" y="449" font-size="34" font-weight="400" fill="#3e3029">不必等全部出現；不自行開車</text>
<rect x="36" y="516" width="728" height="252" rx="22" fill="#fff0dc"/>
<rect x="36" y="516" width="9" height="252" rx="22" fill="#ce6328"/>
<text x="68" y="572" font-size="38" font-weight="700" fill="#ce6328">逐漸變化 → 安排眼科</text>
<text x="68" y="627" font-size="34" font-weight="400" fill="#3e3029">看東西或生活能力逐漸改變</text>
<text x="68" y="675" font-size="34" font-weight="400" fill="#3e3029">記下開始時間、眼別與困難</text>
<text x="68" y="723" font-size="34" font-weight="400" fill="#3e3029">告知醫師；若突然惡化立即求助</text>
<rect x="36" y="790" width="728" height="252" rx="22" fill="#eaf4ef"/>
<rect x="36" y="790" width="9" height="252" rx="22" fill="#266c67"/>
<text x="68" y="846" font-size="38" font-weight="700" fill="#266c67">沒有症狀 → 討論檢查</text>
<text x="68" y="901" font-size="34" font-weight="400" fill="#3e3029">年齡、家族史、高度近視等</text>
<text x="68" y="949" font-size="34" font-weight="400" fill="#3e3029">主動告訴醫師自己的風險背景</text>
<text x="68" y="997" font-size="34" font-weight="400" fill="#3e3029">詢問檢查與下次追蹤的時間</text>
<text x="36" y="1106" font-size="30" font-weight="400" fill="#695b54">一次眼壓正常、看得清楚，都不是保證。</text>
<text x="36" y="1153" font-size="30" font-weight="400" fill="#695b54">緊急時必要可撥 119；切勿自行停處方藥。</text>
<text x="36" y="1200" font-size="28" font-weight="400" fill="#695b54">原創衛教路徑圖｜不能取代眼科診斷</text>
</g></svg>