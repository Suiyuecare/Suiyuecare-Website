<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1230" viewBox="0 0 800 1230" role="img" aria-labelledby="title desc"><title id="title">白內障家庭照顧分工</title><desc id="desc">四項家庭照顧工作：調整生活環境、問清出院指示、核對點藥、安排回診；一切依個別醫囑調整。</desc><rect width="800" height="1230" fill="#fffaf5"/><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif">
<rect x="36" y="32" width="78" height="8" rx="22" fill="#ce6328"/>
<text x="36" y="100" font-size="46" font-weight="700" fill="#3e3029">白內障：把照顧分成四件事</text>
<text x="36" y="152" font-size="30" font-weight="400" fill="#695b54">讓長輩說需求，家人協助把安排記清楚</text>
<rect x="36" y="192" width="728" height="210" rx="22" fill="#ffffff"/>
<rect x="36" y="192" width="9" height="210" rx="22" fill="#ce6328"/>
<text x="68" y="248" font-size="38" font-weight="700" fill="#ce6328">01　生活環境</text>
<text x="68" y="303" font-size="34" font-weight="400" fill="#3e3029">放大字體，調整不刺眼的光</text>
<text x="68" y="351" font-size="34" font-weight="400" fill="#3e3029">固定常用物品，保持走道清楚</text>
<rect x="36" y="422" width="728" height="210" rx="22" fill="#ffffff"/>
<rect x="36" y="422" width="9" height="210" rx="22" fill="#ce6328"/>
<text x="68" y="478" font-size="38" font-weight="700" fill="#ce6328">02　返家指示</text>
<text x="68" y="533" font-size="34" font-weight="400" fill="#3e3029">確認眼別、藥品與保護方式</text>
<text x="68" y="581" font-size="34" font-weight="400" fill="#3e3029">記下回診日與院所聯絡方式</text>
<rect x="36" y="652" width="728" height="210" rx="22" fill="#ffffff"/>
<rect x="36" y="652" width="9" height="210" rx="22" fill="#ce6328"/>
<text x="68" y="708" font-size="38" font-weight="700" fill="#ce6328">03　點藥核對</text>
<text x="68" y="763" font-size="34" font-weight="400" fill="#3e3029">洗手、核對藥名與使用時間</text>
<text x="68" y="811" font-size="34" font-weight="400" fill="#3e3029">記錄實際已點，交班避免重複</text>
<rect x="36" y="882" width="728" height="210" rx="22" fill="#ffffff"/>
<rect x="36" y="882" width="9" height="210" rx="22" fill="#ce6328"/>
<text x="68" y="938" font-size="38" font-weight="700" fill="#ce6328">04　陪同回診</text>
<text x="68" y="993" font-size="34" font-weight="400" fill="#3e3029">整理改善與仍困難的事情</text>
<text x="68" y="1041" font-size="34" font-weight="400" fill="#3e3029">安排接送，帶藥單與問題清單</text>
<text x="36" y="1153" font-size="30" font-weight="400" fill="#695b54">每個人的限制與恢復不同，依醫囑調整。</text>
<text x="36" y="1196" font-size="28" font-weight="400" fill="#695b54">原創衛教資訊圖｜非個別醫療指示</text>
</g></svg>