<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="be-fast-title be-fast-desc">
  <title id="be-fast-title">B.E. FAST 中風辨識</title>
  <desc id="be-fast-desc">六個中風辨識與立即求救步驟。</desc>
  <rect width="1200" height="675" fill="#fffaf3"/>
  <rect width="18" height="675" fill="#f58a1f"/>
  <text x="64" y="62" fill="#f58a1f" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="18" font-weight="850">STROKE WARNING SIGNS</text>
  <text x="64" y="112" fill="#3c1f0b" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="38" font-weight="900">B.E. FAST：任何一項突然異常，就打 119</text>
  <text x="64" y="151" fill="#725b4c" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="20" font-weight="650">先辨識、記時間、叫救護車；不要等全部症狀出現。</text>
  <g>
    <rect x="64" y="224" width="164" height="300" rx="8" fill="#ffffff" stroke="#ead8bf" stroke-width="2"/>
    <rect x="64" y="224" width="8" height="300" rx="4" fill="#f58a1f"/>
    <circle cx="106" cy="266" r="23" fill="#fff0de"/>
    <text x="106" y="274" text-anchor="middle" fill="#f58a1f" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="17" font-weight="900">01</text>
    <text x="88" y="315" text-anchor="start" fill="#3c1f0b" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="19" font-weight="900"><tspan x="88" dy="0">Balance 平</tspan><tspan x="88" dy="25">衡</tspan></text>
    <text x="88" y="381" text-anchor="start" fill="#725b4c" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="16" font-weight="700"><tspan x="88" dy="0">突然站不穩、劇</tspan><tspan x="88" dy="24">烈暈眩</tspan></text>
  </g><line x1="231" y1="374" x2="242" y2="374" stroke="#f58a1f" stroke-width="4" stroke-linecap="round"/><polygon points="242,374 229,366 229,382" fill="#f58a1f"/><g>
    <rect x="246" y="224" width="164" height="300" rx="8" fill="#ffffff" stroke="#ead8bf" stroke-width="2"/>
    <rect x="246" y="224" width="8" height="300" rx="4" fill="#1595a8"/>
    <circle cx="288" cy="266" r="23" fill="#e7f6f8"/>
    <text x="288" y="274" text-anchor="middle" fill="#1595a8" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="17" font-weight="900">02</text>
    <text x="270" y="315" text-anchor="start" fill="#3c1f0b" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="19" font-weight="900"><tspan x="270" dy="0">Eyes 眼睛</tspan></text>
    <text x="270" y="381" text-anchor="start" fill="#725b4c" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="16" font-weight="700"><tspan x="270" dy="0">突然看不清、複</tspan><tspan x="270" dy="24">視或缺一塊</tspan></text>
  </g><line x1="413" y1="374" x2="424" y2="374" stroke="#1595a8" stroke-width="4" stroke-linecap="round"/><polygon points="424,374 411,366 411,382" fill="#1595a8"/><g>
    <rect x="428" y="224" width="164" height="300" rx="8" fill="#ffffff" stroke="#ead8bf" stroke-width="2"/>
    <rect x="428" y="224" width="8" height="300" rx="4" fill="#758d60"/>
    <circle cx="470" cy="266" r="23" fill="#eef4e9"/>
    <text x="470" y="274" text-anchor="middle" fill="#758d60" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="17" font-weight="900">03</text>
    <text x="452" y="315" text-anchor="start" fill="#3c1f0b" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="19" font-weight="900"><tspan x="452" dy="0">Face 臉</tspan></text>
    <text x="452" y="381" text-anchor="start" fill="#725b4c" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="16" font-weight="700"><tspan x="452" dy="0">微笑時一邊嘴角</tspan><tspan x="452" dy="24">垂下</tspan></text>
  </g><line x1="595" y1="374" x2="606" y2="374" stroke="#758d60" stroke-width="4" stroke-linecap="round"/><polygon points="606,374 593,366 593,382" fill="#758d60"/><g>
    <rect x="610" y="224" width="164" height="300" rx="8" fill="#ffffff" stroke="#ead8bf" stroke-width="2"/>
    <rect x="610" y="224" width="8" height="300" rx="4" fill="#4f77a8"/>
    <circle cx="652" cy="266" r="23" fill="#eaf1fa"/>
    <text x="652" y="274" text-anchor="middle" fill="#4f77a8" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="17" font-weight="900">04</text>
    <text x="634" y="315" text-anchor="start" fill="#3c1f0b" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="19" font-weight="900"><tspan x="634" dy="0">Arms 手臂</tspan></text>
    <text x="634" y="381" text-anchor="start" fill="#725b4c" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="16" font-weight="700"><tspan x="634" dy="0">雙手平舉時一邊</tspan><tspan x="634" dy="24">掉下</tspan></text>
  </g><line x1="777" y1="374" x2="788" y2="374" stroke="#4f77a8" stroke-width="4" stroke-linecap="round"/><polygon points="788,374 775,366 775,382" fill="#4f77a8"/><g>
    <rect x="792" y="224" width="164" height="300" rx="8" fill="#ffffff" stroke="#ead8bf" stroke-width="2"/>
    <rect x="792" y="224" width="8" height="300" rx="4" fill="#d95f45"/>
    <circle cx="834" cy="266" r="23" fill="#fce9e4"/>
    <text x="834" y="274" text-anchor="middle" fill="#d95f45" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="17" font-weight="900">05</text>
    <text x="816" y="315" text-anchor="start" fill="#3c1f0b" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="19" font-weight="900"><tspan x="816" dy="0">Speech 說話</tspan></text>
    <text x="816" y="381" text-anchor="start" fill="#725b4c" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="16" font-weight="700"><tspan x="816" dy="0">含糊、用錯字或</tspan><tspan x="816" dy="24">聽不懂</tspan></text>
  </g><line x1="959" y1="374" x2="970" y2="374" stroke="#d95f45" stroke-width="4" stroke-linecap="round"/><polygon points="970,374 957,366 957,382" fill="#d95f45"/><g>
    <rect x="974" y="224" width="164" height="300" rx="8" fill="#ffffff" stroke="#ead8bf" stroke-width="2"/>
    <rect x="974" y="224" width="8" height="300" rx="4" fill="#f58a1f"/>
    <circle cx="1016" cy="266" r="23" fill="#fff0de"/>
    <text x="1016" y="274" text-anchor="middle" fill="#f58a1f" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="17" font-weight="900">06</text>
    <text x="998" y="315" text-anchor="start" fill="#3c1f0b" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="19" font-weight="900"><tspan x="998" dy="0">Time 時間</tspan></text>
    <text x="998" y="381" text-anchor="start" fill="#725b4c" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="16" font-weight="700"><tspan x="998" dy="0">立刻打 119 並</tspan><tspan x="998" dy="24">記錄時間</tspan></text>
  </g>
  <line x1="64" y1="620" x2="1136" y2="620" stroke="#ead8bf" stroke-width="2"/>
  <text x="64" y="650" fill="#725b4c" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="16" font-weight="650">不要自行開車、餵食、喝水或服用阿斯匹靈；請記錄最後正常時間。</text>
</svg>