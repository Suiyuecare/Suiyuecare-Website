<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">長照系統通知分成阻斷、限時與摘要三條路徑</title>
  <desc id="desc">依風險與時效把通知送進三條路徑，每條都有負責人、期限與完成條件。</desc>
  <rect width="1200" height="675" rx="36" fill="#fffaf3"/>
  <text x="72" y="86" font-size="42" font-weight="700" fill="#3c1f0b" font-family="system-ui, sans-serif">一則通知，必須知道要誰在何時做什麼</text>
  <text x="72" y="128" font-size="23" fill="#725b4c" font-family="system-ui, sans-serif">先分級，再指定責任、期限與關閉證據</text>
  <g font-family="system-ui, sans-serif">
    <g transform="translate(72 188)"><rect width="1056" height="120" rx="24" fill="#d95f45"/><text x="40" y="48" font-size="28" font-weight="700" fill="#fffaf3">阻斷路徑｜立即處理</text><text x="40" y="85" font-size="21" fill="#fffaf3">只有持續危險、不可逆錯誤或依法不得繼續的情境</text><text x="880" y="67" font-size="24" font-weight="700" fill="#fffaf3">確認安全後關閉</text></g>
    <g transform="translate(72 334)"><rect width="1056" height="120" rx="24" fill="#f58a1f"/><text x="40" y="48" font-size="28" font-weight="700" fill="#3c1f0b">限時路徑｜交給指定角色</text><text x="40" y="85" font-size="21" fill="#3c1f0b">需要回電、補件、追蹤或交班，但不必打斷當下照顧</text><text x="880" y="67" font-size="24" font-weight="700" fill="#3c1f0b">到期前有回覆</text></g>
    <g transform="translate(72 480)"><rect width="1056" height="120" rx="24" fill="#1595a8"/><text x="40" y="48" font-size="28" font-weight="700" fill="#fffaf3">摘要路徑｜批次閱讀</text><text x="40" y="85" font-size="21" fill="#fffaf3">進度、提醒與資訊更新，集中在固定時段處理</text><text x="880" y="67" font-size="24" font-weight="700" fill="#fffaf3">讀取後留痕</text></g>
  </g>
  <text x="600" y="645" text-anchor="middle" font-size="22" fill="#725b4c" font-family="system-ui, sans-serif">每月回看：哪些常被略過、哪些重複、哪些其實不該通知</text>
</svg>
