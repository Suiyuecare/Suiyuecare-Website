<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">長照系統停機的五段備援流程</title>
  <desc id="desc">從判定停機、啟用紙本、班次點交、系統恢復到補登核對的定性流程，強調每一階段的責任與個資保護。</desc>
  <rect width="1200" height="675" rx="36" fill="#fffaf3"/>
  <text x="72" y="90" font-family="Noto Sans TC, sans-serif" font-size="38" font-weight="700" fill="#3c1f0b">系統停機時，照顧紀錄怎麼不中斷？</text>
  <text x="72" y="132" font-family="Noto Sans TC, sans-serif" font-size="20" fill="#725b4c">先保住服務與最低必要資訊，再有順序地補登與核對</text>
  <g font-family="Noto Sans TC, sans-serif">
    <g transform="translate(60 205)"><rect width="190" height="250" rx="24" fill="#f58a1f"/><text x="24" y="52" font-size="22" font-weight="700" fill="#fff">1 判定停機</text><text x="24" y="96" font-size="18" fill="#fff"><tspan x="24" dy="0">指定角色宣布切換</tspan><tspan x="24" dy="32">確認正式表單版本</tspan><tspan x="24" dy="32">急症仍優先處置</tspan></text></g>
    <path d="M260 330h45" stroke="#725b4c" stroke-width="6"/><path d="m298 318 18 12-18 12" fill="none" stroke="#725b4c" stroke-width="6"/>
    <g transform="translate(320 205)"><rect width="190" height="250" rx="24" fill="#1595a8"/><text x="24" y="52" font-size="22" font-weight="700" fill="#fff">2 紙本記錄</text><text x="24" y="96" font-size="18" fill="#fff"><tspan x="24" dy="0">時間與服務對象</tspan><tspan x="24" dy="32">觀察、處置、結果</tspan><tspan x="24" dy="32">責任人與下一步</tspan></text></g>
    <path d="M520 330h45" stroke="#725b4c" stroke-width="6"/><path d="m558 318 18 12-18 12" fill="none" stroke="#725b4c" stroke-width="6"/>
    <g transform="translate(580 205)"><rect width="190" height="250" rx="24" fill="#758d60"/><text x="24" y="52" font-size="22" font-weight="700" fill="#fff">3 點交保管</text><text x="24" y="96" font-size="18" fill="#fff"><tspan x="24" dy="0">連續編號逐張點交</tspan><tspan x="24" dy="32">標示未完成事項</tspan><tspan x="24" dy="32">限制存取、不拍照</tspan></text></g>
    <path d="M780 330h45" stroke="#725b4c" stroke-width="6"/><path d="m818 318 18 12-18 12" fill="none" stroke="#725b4c" stroke-width="6"/>
    <g transform="translate(840 205)"><rect width="300" height="250" rx="24" fill="#4f77a8"/><text x="24" y="52" font-size="22" font-weight="700" fill="#fff">4 恢復、補登、核對</text><text x="24" y="96" font-size="18" fill="#fff"><tspan x="24" dy="0">公告同一個切回時間</tspan><tspan x="24" dy="32">保留原時間與補登來源</tspan><tspan x="24" dy="32">一人輸入、另一人核對</tspan><tspan x="24" dy="32">依制度處理原始紙本</tspan></text></g>
    <rect x="72" y="510" width="1056" height="94" rx="20" fill="#ead8bf"/>
    <text x="100" y="551" font-size="21" font-weight="700" fill="#3c1f0b">演練檢查：</text><text x="230" y="551" font-size="20" fill="#3c1f0b">拿得到表單　｜　看得懂欄位　｜　交得出去　｜　補得回系統</text>
    <text x="100" y="581" font-size="17" fill="#725b4c">定性流程圖；依機構服務型態、保存制度與個資規範調整。</text>
  </g>
</svg>
