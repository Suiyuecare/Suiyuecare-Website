<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">肌少症追蹤的四個層次</title><desc id="desc">生活目標、肌力、身體表現和肌肉量回答不同問題，並應一起考量疾病、疼痛、營養與量測條件。</desc><rect width="1200" height="675" rx="36" fill="#fffaf3"/><text x="70" y="90" font-size="42" font-weight="700" fill="#3c1f0b">肌少症追蹤：四層一起看，不用體重代替</text><text x="70" y="135" font-size="24" fill="#725b4c">同一方法看趨勢，也保留真實生活反應</text>
  <g font-family="sans-serif"><rect x="85" y="210" width="1030" height="85" rx="20" fill="#f58a1f"/><rect x="145" y="315" width="910" height="85" rx="20" fill="#1595a8"/><rect x="205" y="420" width="790" height="85" rx="20" fill="#758d60"/><rect x="265" y="525" width="670" height="85" rx="20" fill="#4f77a8"/>
  <g fill="#fff" font-size="29" font-weight="700"><text x="125" y="263">生活目標</text><text x="185" y="368">身體表現</text><text x="245" y="473">肌力</text><text x="305" y="578">肌肉量</text></g><g fill="#fff" font-size="23"><text x="390" y="263">原本想做的任務，需要多少協助？</text><text x="425" y="368">起立、步行等整體動作怎麼變？</text><text x="430" y="473">一致條件下的握力或其他肌力</text><text x="455" y="578">由合適設備與專業方法評估</text></g></g>
  <text x="600" y="660" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#3c1f0b">每層都要註明：疾病、疼痛、睡眠、營養、藥物與量測條件</text>
</svg>
