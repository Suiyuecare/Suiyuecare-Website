<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" role="img" aria-labelledby="title desc">
<title id="title">BA07 把洗澡前後安排好</title>
<desc id="desc">先說明長輩能自己做什麼，再討論需要哪一段協助。。沐浴前｜確認需求與環境：說清楚走路、坐下、穿脫衣物的協助需求。、備好用品，檢查走道、照明與地面。；沐浴中｜保留參與與選擇：先約定洗頭需求、習慣時段與隱私安排。、照顧方式與人力，由團隊按個別狀況評估。；沐浴後｜留好交接資訊：約定用品與衣物放置位置，記錄需要調整的事。、同一時段不可併報 BA01 或 BA23。</desc>
<rect width="1200" height="940" fill="#F8F6EF"/>
<g font-family="PingFang TC,Noto Sans TC,Arial,sans-serif" fill="#213F35">
<text x="72" y="76" font-size="23" letter-spacing="3">歲悅長照・照顧碼別介紹</text>
<text x="72" y="150" font-size="48" font-weight="700">BA07｜把洗澡前後安排好</text>
<text x="72" y="204" font-size="25" fill="#566A61">先說明長輩能自己做什麼，再討論需要哪一段協助。</text>
<rect x="72" y="250" width="1056" height="166" rx="22" fill="#E8F2EC"/>
<circle cx="122" cy="298" r="23" fill="#285E4B"/>
<text x="122" y="306" text-anchor="middle" font-size="23" fill="white">1</text>
<text x="163" y="309" font-size="31" font-weight="600">沐浴前｜確認需求與環境</text>
<text x="164" y="351" font-size="25">說清楚走路、坐下、穿脫衣物的協助需求。</text>
<text x="164" y="393" font-size="25">備好用品，檢查走道、照明與地面。</text>
<rect x="72" y="431" width="1056" height="166" rx="22" fill="#EEF1FA"/>
<circle cx="122" cy="479" r="23" fill="#285E4B"/>
<text x="122" y="487" text-anchor="middle" font-size="23" fill="white">2</text>
<text x="163" y="490" font-size="31" font-weight="600">沐浴中｜保留參與與選擇</text>
<text x="164" y="532" font-size="25">先約定洗頭需求、習慣時段與隱私安排。</text>
<text x="164" y="574" font-size="25">照顧方式與人力，由團隊按個別狀況評估。</text>
<rect x="72" y="612" width="1056" height="166" rx="22" fill="#FBF0DF"/>
<circle cx="122" cy="660" r="23" fill="#285E4B"/>
<text x="122" y="668" text-anchor="middle" font-size="23" fill="white">3</text>
<text x="163" y="671" font-size="31" font-weight="600">沐浴後｜留好交接資訊</text>
<text x="164" y="713" font-size="25">約定用品與衣物放置位置，記錄需要調整的事。</text>
<text x="164" y="755" font-size="25">同一時段不可併報 BA01 或 BA23。</text>
<text x="72" y="841" font-size="23" fill="#566A61">家庭準備清單；實際服務以照顧計畫與專業評估為準。</text>
<text x="72" y="886" font-size="20" fill="#62736B">原創資訊圖｜資料查核：2026.09.15｜完整來源及適用限制請見文章</text>
</g></svg>