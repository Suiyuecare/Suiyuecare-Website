<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" role="img" aria-labelledby="title desc">
<title id="title">BA08 足部需求先分清楚</title>
<desc id="desc">先由個管員核對資格，再安排適合的照護與就醫。。日常修剪｜先談一般照顧需求：單純剪指、趾甲屬 BA02 的日常照顧範圍。、不能只因年紀大、剪不到，就直接套用 BA08。；BA08｜符合條件再安排：糖尿病診斷＋相關照顧問題＋指定足部問題。、由完成認可訓練的照顧服務人員執行。；就醫評估｜有警訊不要等待：紅腫熱痛、傷口變黑、化膿或遲遲不癒合。、足部照護服務不能取代傷口診療。</desc>
<rect width="1200" height="940" fill="#F8F6EF"/>
<g font-family="PingFang TC,Noto Sans TC,Arial,sans-serif" fill="#213F35">
<text x="72" y="76" font-size="23" letter-spacing="3">歲悅長照・照顧碼別介紹</text>
<text x="72" y="150" font-size="48" font-weight="700">BA08｜足部需求先分清楚</text>
<text x="72" y="204" font-size="25" fill="#566A61">先由個管員核對資格，再安排適合的照護與就醫。</text>
<rect x="72" y="250" width="1056" height="166" rx="22" fill="#E8F2EC"/>
<circle cx="122" cy="298" r="23" fill="#285E4B"/>
<text x="122" y="306" text-anchor="middle" font-size="23" fill="white">1</text>
<text x="163" y="309" font-size="31" font-weight="600">日常修剪｜先談一般照顧需求</text>
<text x="164" y="351" font-size="25">單純剪指、趾甲屬 BA02 的日常照顧範圍。</text>
<text x="164" y="393" font-size="25">不能只因年紀大、剪不到，就直接套用 BA08。</text>
<rect x="72" y="431" width="1056" height="166" rx="22" fill="#EEF1FA"/>
<circle cx="122" cy="479" r="23" fill="#285E4B"/>
<text x="122" y="487" text-anchor="middle" font-size="23" fill="white">2</text>
<text x="163" y="490" font-size="31" font-weight="600">BA08｜符合條件再安排</text>
<text x="164" y="532" font-size="25">糖尿病診斷＋相關照顧問題＋指定足部問題。</text>
<text x="164" y="574" font-size="25">由完成認可訓練的照顧服務人員執行。</text>
<rect x="72" y="612" width="1056" height="166" rx="22" fill="#FBF0DF"/>
<circle cx="122" cy="660" r="23" fill="#285E4B"/>
<text x="122" y="668" text-anchor="middle" font-size="23" fill="white">3</text>
<text x="163" y="671" font-size="31" font-weight="600">就醫評估｜有警訊不要等待</text>
<text x="164" y="713" font-size="25">紅腫熱痛、傷口變黑、化膿或遲遲不癒合。</text>
<text x="164" y="755" font-size="25">足部照護服務不能取代傷口診療。</text>
<text x="72" y="841" font-size="23" fill="#566A61">一般說明；不代表已符合給付資格，也不取代個別醫囑。</text>
<text x="72" y="886" font-size="20" fill="#62736B">原創資訊圖｜資料查核：2026.09.15｜完整來源及適用限制請見文章</text>
</g></svg>