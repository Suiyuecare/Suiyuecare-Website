<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="chart-title chart-desc">
<title id="chart-title">讓家仍是自己的家</title>
<desc id="chart-desc">四段家用溝通流程：聽本人需求，分清可協助與保留範圍，移動前詢問，完成後歸位。非授權書與研究驗證量表。</desc>
<rect width="1200" height="675" rx="28" fill="#fffaf3"/>
<g font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" fill="#3c1f0b">
<rect x="52" y="47" width="7" height="50" rx="3" fill="#f58a1f"/><text x="78" y="80" font-size="23" fill="#725b4c">居服物品與隱私約定</text>
<text x="52" y="154" font-size="42" font-weight="700">讓家仍是自己的家</text>
<text x="53" y="198" font-size="21" fill="#725b4c">定性流程示意｜依本人需要、服務計畫與現行規範調整</text>
<g transform="translate(52,235)"><rect width="250" height="222" rx="22" fill="white" stroke="#ead8bf" stroke-width="2"/><circle cx="40" cy="43" r="22" fill="#1595a8"/><text x="40" y="51" text-anchor="middle" fill="white" font-size="24" font-weight="700">1</text><text x="25" y="105" font-size="29" font-weight="700">聽本人</text><text x="25" y="153" font-size="20" fill="#725b4c">從常用的小區域開始</text><text x="25" y="187" font-size="20" fill="#725b4c">了解物品與位置偏好</text></g><path d="M310 341h16m-6-6 6 6-6 6" fill="none" stroke="#725b4c" stroke-width="3"/>
<g transform="translate(334,235)"><rect width="250" height="222" rx="22" fill="white" stroke="#ead8bf" stroke-width="2"/><circle cx="40" cy="43" r="22" fill="#758d60"/><text x="40" y="51" text-anchor="middle" fill="white" font-size="24" font-weight="700">2</text><text x="25" y="105" font-size="29" font-weight="700">分範圍</text><text x="25" y="153" font-size="20" fill="#725b4c">可協助／先詢問</text><text x="25" y="187" font-size="20" fill="#725b4c">私人保留</text></g><path d="M592 341h16m-6-6 6 6-6 6" fill="none" stroke="#725b4c" stroke-width="3"/>
<g transform="translate(616,235)"><rect width="250" height="222" rx="22" fill="white" stroke="#ead8bf" stroke-width="2"/><circle cx="40" cy="43" r="22" fill="#4f77a8"/><text x="40" y="51" text-anchor="middle" fill="white" font-size="24" font-weight="700">3</text><text x="25" y="105" font-size="29" font-weight="700">先詢問</text><text x="25" y="153" font-size="20" fill="#725b4c">說明動作與暫放位置</text><text x="25" y="187" font-size="20" fill="#725b4c">依計畫確認同意</text></g><path d="M874 341h16m-6-6 6 6-6 6" fill="none" stroke="#725b4c" stroke-width="3"/>
<g transform="translate(898,235)"><rect width="250" height="222" rx="22" fill="white" stroke="#ead8bf" stroke-width="2"/><circle cx="40" cy="43" r="22" fill="#d95f45"/><text x="40" y="51" text-anchor="middle" fill="white" font-size="24" font-weight="700">4</text><text x="25" y="105" font-size="29" font-weight="700">再歸位</text><text x="25" y="153" font-size="20" fill="#725b4c">一起確認找得到</text><text x="25" y="187" font-size="20" fill="#725b4c">未談妥的交督導</text></g>
<rect x="52" y="490" width="1096" height="65" rx="16" fill="#ead8bf"/><text x="76" y="531" font-size="22">有立即危險：依緊急流程處理。鑰匙、醫療與財務另依正式規範。</text>
<text x="53" y="599" font-size="18" fill="#725b4c">原則依據：NICE NG21（2015）；Sanerma 等（2020）；Fjordside 等（2016）。</text>
