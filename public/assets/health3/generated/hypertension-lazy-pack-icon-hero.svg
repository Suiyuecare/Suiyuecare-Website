    <style>
      .dark{fill:#321606}.muted{fill:#655247}.orange{fill:#ff8a1f}.blue{fill:#3d84b6}.teal{fill:#4d8f85}.red{fill:#d95b43}.soft{fill:#fff}.line{fill:none;stroke:currentColor;stroke-width:10;stroke-linecap:round;stroke-linejoin:round}.label{font-family:Arial,'Noto Sans TC',sans-serif;font-weight:900}.small{font-size:42px}.mid{font-size:70px}.big{font-size:116px}
    </style>
