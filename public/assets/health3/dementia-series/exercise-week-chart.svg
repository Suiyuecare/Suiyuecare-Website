<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="exercise-week-title exercise-week-desc">
  <title id="exercise-week-title">一週護腦運動配置</title>
  <desc id="exercise-week-desc">以一週七天範例說明有氧、肌力與平衡訓練如何分配。</desc>
  <rect width="1200" height="675" fill="#fffaf3"/>
  <rect x="0" y="0" width="18" height="675" fill="#f58a1f"/>
  <text x="64" y="66" fill="#f58a1f" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="18" font-weight="800" letter-spacing="2">WEEKLY MOVEMENT PLAN</text>
  <text x="64" y="118" fill="#3c1f0b" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="38" font-weight="900">有氧打底、肌力撐住、平衡守安全</text>
  <text x="64" y="154" fill="#725b4c" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="20" font-weight="650">這是配置範例，不是處方；從能說話但微喘的強度慢慢累積。</text>
