    <text x="902" y="444" text-anchor="middle" fill="#725b4c" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="16" font-weight="700">彈力帶<br/>提踵</text>
  </g>
  <rect x="64" y="530" width="318" height="40" rx="8" fill="#fff0de" stroke="#f58a1f" stroke-width="1.5"/>
  <text x="223" y="557" fill="#f58a1f" text-anchor="middle" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="17" font-weight="850">每週至少 150 分鐘中等強度有氧</text>
  <rect x="402" y="530" width="258" height="40" rx="8" fill="#e7f6f8" stroke="#1595a8" stroke-width="1.5"/>
  <text x="531" y="557" fill="#1595a8" text-anchor="middle" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="17" font-weight="850">每週至少 2 天肌力</text>
  <rect x="680" y="530" width="456" height="40" rx="8" fill="#eef4e9" stroke="#758d60" stroke-width="1.5"/>
  <text x="908" y="557" fill="#758d60" text-anchor="middle" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="17" font-weight="850">行動較不穩者：每週至少 3 天平衡練習</text>
  
  <line x1="64" y1="620" x2="1136" y2="620" stroke="#ead8bf" stroke-width="2"/>
  <text x="64" y="650" fill="#725b4c" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="16" font-weight="650">胸痛、暈眩、喘不過氣或新出現疼痛時先停止；久未運動者可先從 5–10 分鐘開始。</text>
