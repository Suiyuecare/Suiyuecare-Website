<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="brain-healthy-plate-title brain-healthy-plate-desc">
  <title id="brain-healthy-plate-title">一日護腦餐盤</title>
  <desc id="brain-healthy-plate-desc">依國民健康署我的餐盤口訣整理蔬菜、水果、全穀、蛋白質、乳品與堅果。</desc>
  <rect width="1200" height="675" fill="#fffaf3"/>
  <rect x="0" y="0" width="18" height="675" fill="#f58a1f"/>
  <text x="64" y="66" fill="#f58a1f" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="18" font-weight="800" letter-spacing="2">BRAIN-HEALTHY PLATE</text>
  <text x="64" y="118" fill="#3c1f0b" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="38" font-weight="900">先把餐盤吃完整，再談保健品</text>
  <text x="64" y="154" fill="#725b4c" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="20" font-weight="650">沒有單一護腦食物；重點是多樣、原型、吃得下，而且能長期維持。</text>
  <circle cx="350" cy="385" r="182" fill="#ffffff" stroke="#ead8bf" stroke-width="8"/>
  <path d="M350 203 A182 182 0 0 0 168 385 L350 385 Z" fill="#eef4e9"/>
  <path d="M168 385 A182 182 0 0 0 350 567 L350 385 Z" fill="#fff0de"/>
  <path d="M350 203 A182 182 0 0 1 532 385 L350 385 Z" fill="#fff6d9"/>
  <path d="M532 385 A182 182 0 0 1 350 567 L350 385 Z" fill="#e7f6f8"/>
  <text x="260" y="320" fill="#758d60" text-anchor="middle" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="21" font-weight="900"><tspan x="260" dy="0">蔬菜</tspan><tspan x="260" dy="29">量比水果多</tspan></text>
  <text x="260" y="445" fill="#f58a1f" text-anchor="middle" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="20" font-weight="900"><tspan x="260" dy="0">全穀雜糧</tspan><tspan x="260" dy="29">至少 1/3 未精製</tspan></text>
  <text x="440" y="320" fill="#d89e2b" text-anchor="middle" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="21" font-weight="900"><tspan x="440" dy="0">水果</tspan><tspan x="440" dy="29">每餐約一拳</tspan></text>
  <text x="440" y="445" fill="#1595a8" text-anchor="middle" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="21" font-weight="900"><tspan x="440" dy="0">豆魚蛋肉</tspan><tspan x="440" dy="29">一掌心</tspan></text>
  <g>
    <rect x="600" y="205" width="536" height="100" rx="8" fill="#ffffff" stroke="#ead8bf" stroke-width="2"/>
    <rect x="600" y="205" width="8" height="100" rx="4" fill="#4f77a8"/>
    
    <text x="626" y="252" fill="#3c1f0b" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="22" font-weight="900">每天早晚一杯奶</text>
    <text x="626" y="287" fill="#725b4c" text-anchor="start" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="17" font-weight="700"><tspan x="626" dy="0">乳品可依個人耐受與營養需求選擇。</tspan></text>
  </g>
  <g>
    <rect x="600" y="325" width="536" height="100" rx="8" fill="#ffffff" stroke="#ead8bf" stroke-width="2"/>
    <rect x="600" y="325" width="8" height="100" rx="4" fill="#f58a1f"/>
    
    <text x="626" y="372" fill="#3c1f0b" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="22" font-weight="900">每天一茶匙堅果種子</text>
    <text x="626" y="407" fill="#725b4c" text-anchor="start" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="17" font-weight="700"><tspan x="626" dy="0">原味、少鹽；吞嚥或咀嚼困難者需調整質地。</tspan></text>
  </g>
  <g>
    <rect x="600" y="445" width="536" height="100" rx="8" fill="#ffffff" stroke="#ead8bf" stroke-width="2"/>
    <rect x="600" y="445" width="8" height="100" rx="4" fill="#1595a8"/>
    
    <text x="626" y="492" fill="#3c1f0b" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="22" font-weight="900">喝水、少糖、少加工</text>
    <text x="626" y="527" fill="#725b4c" text-anchor="start" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="17" font-weight="700"><tspan x="626" dy="0">以水為主；加工肉品、含糖飲料與過量鹽分少一點。</tspan></text>
  </g>
  
  <line x1="64" y1="620" x2="1136" y2="620" stroke="#ead8bf" stroke-width="2"/>
  <text x="64" y="650" fill="#725b4c" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="16" font-weight="650">食量下降、體重快速減輕、常嗆咳或有腎臟病等狀況，請依醫療與營養專業建議調整。</text>
</svg>