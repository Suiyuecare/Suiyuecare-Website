<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="supplement-evidence-title supplement-evidence-desc">
  <title id="supplement-evidence-title">護腦保健品判讀流程</title>
  <desc id="supplement-evidence-desc">從是否有確診缺乏、藥物交互作用與研究證據，判斷保健品使用前該問的問題。</desc>
  <rect width="1200" height="675" fill="#fffaf3"/>
  <rect x="0" y="0" width="18" height="675" fill="#f58a1f"/>
  <text x="64" y="66" fill="#f58a1f" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="18" font-weight="800" letter-spacing="2">SUPPLEMENT DECISION GUIDE</text>
  <text x="64" y="118" fill="#3c1f0b" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="38" font-weight="900">買保健品前，先問三個問題</text>
  <text x="64" y="154" fill="#725b4c" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="20" font-weight="650">沒有任何保健品被證明能保證預防或治療失智；先處理真正缺乏與可改變風險。</text>
  <rect x="64" y="220" width="310" height="130" rx="8" fill="#ffffff" stroke="#f58a1f" stroke-width="3"/>
  <text x="219" y="270" fill="#3c1f0b" text-anchor="middle" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="22" font-weight="900"><tspan x="219" dy="0">1  有檢驗或診斷證實</tspan><tspan x="219" dy="34">營養素缺乏嗎？</tspan></text>
  <line x1="390" y1="285" x2="475" y2="285" stroke="#f58a1f" stroke-width="4" stroke-linecap="round"/>
  <polygon points="475,285 466.33974596215563,290 466.33974596215563,280" fill="#f58a1f"/>
  <rect x="495" y="220" width="270" height="130" rx="8" fill="#eef4e9" stroke="#758d60" stroke-width="3"/>
  <text x="630" y="270" fill="#758d60" text-anchor="middle" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="21" font-weight="900"><tspan x="630" dy="0">有缺乏</tspan><tspan x="630" dy="34">依醫囑補充與追蹤</tspan></text>
  <line x1="219" y1="370" x2="219" y2="430" stroke="#db6547" stroke-width="4" stroke-linecap="round"/>
  <polygon points="219,430 214,421.33974596215563 224,421.33974596215563" fill="#db6547"/>
  <rect x="64" y="450" width="310" height="130" rx="8" fill="#fcebe6" stroke="#db6547" stroke-width="3"/>
  <text x="219" y="500" fill="#db6547" text-anchor="middle" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="20" font-weight="900"><tspan x="219" dy="0">沒有缺乏／不確定</tspan><tspan x="219" dy="34">不要只因廣告就長期吃</tspan></text>
  <line x1="390" y1="515" x2="475" y2="515" stroke="#db6547" stroke-width="4" stroke-linecap="round"/>
  <polygon points="475,515 466.33974596215563,520 466.33974596215563,510" fill="#db6547"/>
  <rect x="495" y="420" width="641" height="160" rx="8" fill="#ffffff" stroke="#ead8bf" stroke-width="2"/>
  <text x="815" y="463" text-anchor="middle" fill="#3c1f0b" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="22" font-weight="900">2  和藥物衝突嗎？　3  證據支持誰、什麼劑量、多久？</text>
  <rect x="530" y="492" width="126" height="40" rx="8" fill="#eaf1fa" stroke="#4f77a8" stroke-width="1.5"/>
  <text x="593" y="519" fill="#4f77a8" text-anchor="middle" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="17" font-weight="850">魚油</text>
  <rect x="674" y="492" width="126" height="40" rx="8" fill="#fff0de" stroke="#f58a1f" stroke-width="1.5"/>
  <text x="737" y="519" fill="#f58a1f" text-anchor="middle" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="17" font-weight="850">銀杏</text>
  <rect x="818" y="492" width="126" height="40" rx="8" fill="#e7f6f8" stroke="#1595a8" stroke-width="1.5"/>
  <text x="881" y="519" fill="#1595a8" text-anchor="middle" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="17" font-weight="850">維他命</text>
  <rect x="962" y="492" width="138" height="40" rx="8" fill="#eef4e9" stroke="#758d60" stroke-width="1.5"/>
  <text x="1031" y="519" fill="#758d60" text-anchor="middle" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="17" font-weight="850">綜合補充品</text>
  <text x="815" y="560" text-anchor="middle" fill="#725b4c" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="17" font-weight="750">先帶完整用藥與保健品清單，詢問醫師或藥師。</text>
  
  <line x1="64" y1="620" x2="1136" y2="620" stroke="#ead8bf" stroke-width="2"/>
  <text x="64" y="650" fill="#725b4c" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="16" font-weight="650">世界衛生組織不建議在沒有診斷缺乏時，例行以 B／E 維生素、Omega-3 或綜合維他命預防認知退化。</text>
</svg>