      </g>
    </g>
    <g class="label micro green" text-anchor="middle">
      <text x="130" y="372">一</text><text x="280" y="372">二</text><text x="430" y="372">三</text><text x="580" y="372">四</text><text x="730" y="372">五</text><text x="880" y="372">六</text>
    </g>
  </g>
