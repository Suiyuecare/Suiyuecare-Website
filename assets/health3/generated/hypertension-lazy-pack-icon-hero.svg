<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">高血壓家庭照顧圖解</title>
  <desc id="desc">透明背景的高血壓懶人包圖示，包含一週趨勢、722量測、紅旗症狀與家庭分工。</desc>
  <style>
    .ink{fill:#183833}.green{fill:#177a6d}.deep{fill:#173b36}.orange{fill:#efbb4f}.coral{fill:#d34e48}.blue{fill:#2f68ae}.white{fill:#fffaf1}.muted{fill:#b8d2ca}.label{font-family:Arial,'Noto Sans TC',sans-serif;font-weight:900}.eyebrow{font-size:30px;letter-spacing:4px}.title{font-size:118px}.sub{font-size:48px}.body{font-size:29px}.micro{font-size:22px;letter-spacing:2px}.line{fill:none;stroke:currentColor;stroke-width:12;stroke-linecap:round;stroke-linejoin:round}
  </style>
  <g transform="translate(72 76)">
    <rect width="492" height="748" rx="32" class="deep"/>
    <text class="label eyebrow orange" x="48" y="78">HEALTH 3.0</text>
    <text class="label title white" x="46" y="250">高血壓</text>
    <text class="label sub orange" x="50" y="328">先看趨勢</text>
    <text class="label body muted" x="50" y="382">再決定下一步</text>
    <line x1="50" y1="438" x2="380" y2="438" stroke="#5b9186" stroke-width="3"/>
    <text class="label micro white" x="50" y="504">7 張照顧重點圖</text>
    <text class="label body muted" x="50" y="554">量測 · 紅旗 · 用藥 · 分工</text>
    <g transform="translate(48 618)">
