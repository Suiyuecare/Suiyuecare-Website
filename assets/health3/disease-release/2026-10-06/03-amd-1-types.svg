<svg role="img" xmlns="http://www.w3.org/2000/svg" width="900" height="466" viewBox="0 0 900 466"><desc>圖解｜類型和階段需由散瞳檢查、必要時 OCT 等檢查判定。</desc><title>乾性與濕性黃斑部病變</title><rect width="900" height="466" fill="#FFF8F0"/><text x="45" y="70" font-family="sans-serif" font-size="36" font-weight="700" fill="#8B411B">乾性與濕性黃斑部病變</text><rect x="45" y="120" width="810" height="70" rx="18" fill="white" stroke="#E8CDB7"/><circle cx="87" cy="155" r="23" fill="#ED762F"/><text x="87" y="163" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="white">1</text><text x="130" y="164" font-family="sans-serif" font-size="27" fill="#4F3D31">乾性較常見，通常進展較慢</text><rect x="45" y="212" width="810" height="70" rx="18" fill="white" stroke="#E8CDB7"/><circle cx="87" cy="247" r="23" fill="#ED762F"/><text x="87" y="255" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="white">2</text><text x="130" y="256" font-family="sans-serif" font-size="27" fill="#4F3D31">濕性較少見，可能較快失去視力</text><rect x="45" y="304" width="810" height="70" rx="18" fill="white" stroke="#E8CDB7"/><circle cx="87" cy="339" r="23" fill="#ED762F"/><text x="87" y="347" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="white">3</text><text x="130" y="348" font-family="sans-serif" font-size="27" fill="#4F3D31">兩者都需眼科判斷與追蹤</text></svg>