<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-labelledby="title desc"><title id="title">低視能友善居家：光線、對比、走道</title><desc id="desc">若視力影響生活可詢問視覺復健；常走路線保持清楚；照明足夠並避免眩光；放大文字與提高對比</desc><rect width="900" height="100%" fill="#FFF9F2"/><text x="48" y="76" font-family="sans-serif" font-size="36" font-weight="700" fill="#703B20">低視能友善居家：光線、對比、走道</text><text x="48" y="122" font-family="sans-serif" font-size="22" fill="#694E3D">若視力影響生活可詢問視覺復健</text><rect x="44" y="160" width="812" height="72" rx="18" fill="#FFFFFF" stroke="#EBD7C6"/><circle cx="88" cy="196" r="23" fill="#F17A36"/><text x="88" y="204" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">1</text><text x="130" y="205" font-family="sans-serif" font-size="26" fill="#563D2E">常走路線保持清楚</text><rect x="44" y="250" width="812" height="72" rx="18" fill="#FFFFFF" stroke="#EBD7C6"/><circle cx="88" cy="286" r="23" fill="#E96A24"/><text x="88" y="294" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">2</text><text x="130" y="295" font-family="sans-serif" font-size="26" fill="#563D2E">照明足夠並避免眩光</text><rect x="44" y="340" width="812" height="72" rx="18" fill="#FFFFFF" stroke="#EBD7C6"/><circle cx="88" cy="376" r="23" fill="#D8591E"/><text x="88" y="384" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">3</text><text x="130" y="385" font-family="sans-serif" font-size="26" fill="#563D2E">放大文字與提高對比</text></svg>