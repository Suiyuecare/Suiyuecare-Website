<svg role="img" xmlns="http://www.w3.org/2000/svg" width="900" height="456" viewBox="0 0 900 456"><desc>圖解｜照明、對比與固定位置能降低尋找負擔。</desc><title>讓中央視力不足更好生活</title><rect width="900" height="456" fill="#FFF8F0"/><text x="45" y="70" font-family="sans-serif" font-size="36" font-weight="700" fill="#8B411B">讓中央視力不足更好生活</text><rect x="45" y="115" width="810" height="70" rx="18" fill="white" stroke="#E8CDB7"/><circle cx="87" cy="150" r="23" fill="#ED762F"/><text x="87" y="158" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="white">1</text><text x="130" y="159" font-family="sans-serif" font-size="27" fill="#4F3D31">增加照明並減少眩光</text><rect x="45" y="207" width="810" height="70" rx="18" fill="white" stroke="#E8CDB7"/><circle cx="87" cy="242" r="23" fill="#ED762F"/><text x="87" y="250" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="white">2</text><text x="130" y="251" font-family="sans-serif" font-size="27" fill="#4F3D31">放大文字、提高色彩對比</text><rect x="45" y="299" width="810" height="70" rx="18" fill="white" stroke="#E8CDB7"/><circle cx="87" cy="334" r="23" fill="#ED762F"/><text x="87" y="342" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="white">3</text><text x="130" y="343" font-family="sans-serif" font-size="27" fill="#4F3D31">常用物品固定位置</text></svg>