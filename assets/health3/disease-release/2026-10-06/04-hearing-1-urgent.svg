<svg role="img" xmlns="http://www.w3.org/2000/svg" width="900" height="456" viewBox="0 0 900 456"><desc>圖解｜突然發生與逐年變化的處理速度不同。</desc><title>哪些情況要加快就醫</title><rect width="900" height="456" fill="#FFF8F0"/><text x="45" y="70" font-family="sans-serif" font-size="36" font-weight="700" fill="#8B411B">哪些情況要加快就醫</text><rect x="45" y="115" width="810" height="70" rx="18" fill="white" stroke="#E8CDB7"/><circle cx="87" cy="150" r="23" fill="#ED762F"/><text x="87" y="158" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="white">1</text><text x="130" y="159" font-family="sans-serif" font-size="27" fill="#4F3D31">突然單耳或雙耳聽力下降</text><rect x="45" y="207" width="810" height="70" rx="18" fill="white" stroke="#E8CDB7"/><circle cx="87" cy="242" r="23" fill="#ED762F"/><text x="87" y="250" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="white">2</text><text x="130" y="251" font-family="sans-serif" font-size="27" fill="#4F3D31">耳痛、流液或明顯暈眩</text><rect x="45" y="299" width="810" height="70" rx="18" fill="white" stroke="#E8CDB7"/><circle cx="87" cy="334" r="23" fill="#ED762F"/><text x="87" y="342" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="white">3</text><text x="130" y="343" font-family="sans-serif" font-size="27" fill="#4F3D31">新發耳鳴合併聽力改變</text></svg>