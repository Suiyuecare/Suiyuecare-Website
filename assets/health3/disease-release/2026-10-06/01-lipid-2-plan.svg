<svg role="img" viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" width="900" height="600"><desc>圖解｜生活、藥物與追蹤共同降低風險。</desc><title>血脂治療三個部分</title><rect width="900" height="600" rx="28" fill="#E7F1E4"/><text x="60" y="92" font-size="38" font-weight="700" fill="#8C431B">治療三個部分</text><rect x="75" y="190" width="750" height="68" rx="16" fill="white"/><circle cx="112" cy="224" r="18" fill="#E87832"/><text x="112" y="231" text-anchor="middle" font-size="18" fill="white">1</text><text x="150" y="233" font-size="25" fill="#513C32">生活型態調整</text><rect x="75" y="282" width="750" height="68" rx="16" fill="white"/><circle cx="112" cy="316" r="18" fill="#E87832"/><text x="112" y="231" text-anchor="middle" font-size="18" fill="white">2</text><text x="150" y="233" font-size="25" fill="#513C32">依風險使用藥物</text><rect x="75" y="374" width="750" height="68" rx="16" fill="white"/><circle cx="112" cy="408" r="18" fill="#E87832"/><text x="112" y="231" text-anchor="middle" font-size="18" fill="white">3</text><text x="150" y="233" font-size="25" fill="#513C32">定期檢驗與回診</text></svg>