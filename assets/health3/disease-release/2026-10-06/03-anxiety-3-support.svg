<svg role="img" xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600"><desc>圖解｜確認安全、傾聽、具體下一步、留下紀錄。</desc><title>焦慮陪伴四步驟</title><rect width="900" height="600" rx="28" fill="#E7F1E4"/><text x="60" y="92" font-size="38" font-weight="700" fill="#8C431B">焦慮陪伴四步驟</text><text x="60" y="135" font-size="20" fill="#6B574A">歲悅長照｜原創圖解</text><rect x="75" y="190" width="750" height="68" rx="16" fill="white"/><circle cx="112" cy="224" r="18" fill="#E87832"/><text x="112" y="231" text-anchor="middle" font-size="18" fill="white">1</text><text x="150" y="233" font-size="25" fill="#513C32">先確認當下安全</text><rect x="75" y="282" width="750" height="68" rx="16" fill="white"/><circle cx="112" cy="316" r="18" fill="#E87832"/><text x="112" y="231" text-anchor="middle" font-size="18" fill="white">2</text><text x="150" y="233" font-size="25" fill="#513C32">聽懂具體擔心</text><rect x="75" y="374" width="750" height="68" rx="16" fill="white"/><circle cx="112" cy="408" r="18" fill="#E87832"/><text x="112" y="231" text-anchor="middle" font-size="18" fill="white">3</text><text x="150" y="233" font-size="25" fill="#513C32">安排一個下一步</text><rect x="75" y="466" width="750" height="68" rx="16" fill="white"/><circle cx="112" cy="500" r="18" fill="#E87832"/><text x="112" y="231" text-anchor="middle" font-size="18" fill="white">4</text><text x="150" y="233" font-size="25" fill="#513C32">記錄變化與結果</text></svg>