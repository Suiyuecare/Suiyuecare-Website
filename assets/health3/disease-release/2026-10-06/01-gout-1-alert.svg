<svg role="img" xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430"><desc>圖解｜發燒、全身不適或無法負重，不宜只在家觀察。</desc><title>關節疼痛就醫分流</title><rect width="960" height="430" rx="28" fill="#fffdf8"/><text x="480" y="82" text-anchor="middle" font-size="38" font-family="sans-serif" font-weight="700" fill="#8d3f16">需要儘快就醫</text><rect x="40" y="150" rx="20" width="275" height="210" fill="#fff7e8" stroke="#b65c24" stroke-width="3"/><circle cx="82" cy="195" r="24" fill="#9c4312"/><text x="82" y="204" text-anchor="middle" font-size="25" fill="white">1</text><text x="177.5" y="270" text-anchor="middle" font-size="28" fill="#57351f">發燒</text><rect x="333" y="150" rx="20" width="275" height="210" fill="#f8dfbf" stroke="#b65c24" stroke-width="3"/><circle cx="375" cy="195" r="24" fill="#9c4312"/><text x="375" y="204" text-anchor="middle" font-size="25" fill="white">2</text><text x="470.5" y="270" text-anchor="middle" font-size="28" fill="#57351f">無法負重</text><rect x="626" y="150" rx="20" width="275" height="210" fill="#f5c485" stroke="#b65c24" stroke-width="3"/><circle cx="668" cy="195" r="24" fill="#9c4312"/><text x="668" y="204" text-anchor="middle" font-size="25" fill="white">3</text><text x="763.5" y="270" text-anchor="middle" font-size="28" fill="#57351f">首次劇痛</text><text x="480" y="405" text-anchor="middle" font-size="20" font-family="sans-serif" fill="#76543c">歲悅原創圖解｜2026-09-28</text></svg>