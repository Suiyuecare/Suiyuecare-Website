<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="safe-eating-title safe-eating-desc">
  <title id="safe-eating-title">中風吞嚥安全流程</title>
  <desc id="safe-eating-desc">餐前、餐中與餐後的吞嚥照顧流程。</desc>
  <rect width="1200" height="675" fill="#fffaf3"/>
  <rect width="18" height="675" fill="#f58a1f"/>
  <text x="64" y="62" fill="#f58a1f" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="18" font-weight="850">SAFE EATING AFTER STROKE</text>
  <text x="64" y="112" fill="#3c1f0b" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="38" font-weight="900">安全進食不是餵得慢，而是每一步都對</text>
  <text x="64" y="151" fill="#725b4c" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="20" font-weight="650">質地、稠度與姿勢以個別評估為準；共同原則是清醒、坐好、少量、清潔。</text>
  <g>
    <rect x="64" y="224" width="196" height="300" rx="8" fill="#ffffff" stroke="#ead8bf" stroke-width="2"/>
    <rect x="64" y="224" width="8" height="300" rx="4" fill="#f58a1f"/>
    <circle cx="106" cy="266" r="23" fill="#fff0de"/>
    <text x="106" y="274" text-anchor="middle" fill="#f58a1f" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="17" font-weight="900">01</text>
    <text x="88" y="315" text-anchor="start" fill="#3c1f0b" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="19" font-weight="900"><tspan x="88" dy="0">先評估</tspan></text>
    <text x="88" y="381" text-anchor="start" fill="#725b4c" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="16" font-weight="700"><tspan x="88" dy="0">未完成吞嚥篩檢前不</tspan><tspan x="88" dy="24">口餵</tspan></text>
  </g><line x1="263" y1="374" x2="278" y2="374" stroke="#f58a1f" stroke-width="4" stroke-linecap="round"/><polygon points="278,374 265,366 265,382" fill="#f58a1f"/><g>
    <rect x="282" y="224" width="196" height="300" rx="8" fill="#ffffff" stroke="#ead8bf" stroke-width="2"/>
    <rect x="282" y="224" width="8" height="300" rx="4" fill="#1595a8"/>
    <circle cx="324" cy="266" r="23" fill="#e7f6f8"/>
    <text x="324" y="274" text-anchor="middle" fill="#1595a8" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="17" font-weight="900">02</text>
    <text x="306" y="315" text-anchor="start" fill="#3c1f0b" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="19" font-weight="900"><tspan x="306" dy="0">餐前</tspan></text>
    <text x="306" y="381" text-anchor="start" fill="#725b4c" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="16" font-weight="700"><tspan x="306" dy="0">確認清醒、呼吸與坐</tspan><tspan x="306" dy="24">姿</tspan></text>
  </g><line x1="481" y1="374" x2="496" y2="374" stroke="#1595a8" stroke-width="4" stroke-linecap="round"/><polygon points="496,374 483,366 483,382" fill="#1595a8"/><g>
    <rect x="500" y="224" width="196" height="300" rx="8" fill="#ffffff" stroke="#ead8bf" stroke-width="2"/>
    <rect x="500" y="224" width="8" height="300" rx="4" fill="#758d60"/>
    <circle cx="542" cy="266" r="23" fill="#eef4e9"/>
    <text x="542" y="274" text-anchor="middle" fill="#758d60" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="17" font-weight="900">03</text>
    <text x="524" y="315" text-anchor="start" fill="#3c1f0b" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="19" font-weight="900"><tspan x="524" dy="0">餐中</tspan></text>
    <text x="524" y="381" text-anchor="start" fill="#725b4c" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="16" font-weight="700"><tspan x="524" dy="0">符合質地、每口少量</tspan><tspan x="524" dy="24">、慢慢吃</tspan></text>
  </g><line x1="699" y1="374" x2="714" y2="374" stroke="#758d60" stroke-width="4" stroke-linecap="round"/><polygon points="714,374 701,366 701,382" fill="#758d60"/><g>
    <rect x="718" y="224" width="196" height="300" rx="8" fill="#ffffff" stroke="#ead8bf" stroke-width="2"/>
    <rect x="718" y="224" width="8" height="300" rx="4" fill="#4f77a8"/>
    <circle cx="760" cy="266" r="23" fill="#eaf1fa"/>
    <text x="760" y="274" text-anchor="middle" fill="#4f77a8" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="17" font-weight="900">04</text>
    <text x="742" y="315" text-anchor="start" fill="#3c1f0b" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="19" font-weight="900"><tspan x="742" dy="0">遇警訊</tspan></text>
    <text x="742" y="381" text-anchor="start" fill="#725b4c" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="16" font-weight="700"><tspan x="742" dy="0">咳嗽、濕嗓、疲累立</tspan><tspan x="742" dy="24">即停止</tspan></text>
  </g><line x1="917" y1="374" x2="932" y2="374" stroke="#4f77a8" stroke-width="4" stroke-linecap="round"/><polygon points="932,374 919,366 919,382" fill="#4f77a8"/><g>
    <rect x="936" y="224" width="196" height="300" rx="8" fill="#ffffff" stroke="#ead8bf" stroke-width="2"/>
    <rect x="936" y="224" width="8" height="300" rx="4" fill="#d95f45"/>
    <circle cx="978" cy="266" r="23" fill="#fce9e4"/>
    <text x="978" y="274" text-anchor="middle" fill="#d95f45" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="17" font-weight="900">05</text>
    <text x="960" y="315" text-anchor="start" fill="#3c1f0b" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="19" font-weight="900"><tspan x="960" dy="0">餐後</tspan></text>
    <text x="960" y="381" text-anchor="start" fill="#725b4c" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="16" font-weight="700"><tspan x="960" dy="0">檢查殘留、維持坐姿</tspan><tspan x="960" dy="24">、刷牙</tspan></text>
  </g>
  <line x1="64" y1="620" x2="1136" y2="620" stroke="#ead8bf" stroke-width="2"/>
  <text x="64" y="650" fill="#725b4c" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="16" font-weight="650">嗆咳、濕嗓、呼吸異常或意識變差時停止餵食並求助。</text>
</svg>