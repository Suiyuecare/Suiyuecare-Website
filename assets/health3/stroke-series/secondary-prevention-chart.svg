<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="secondary-prevention-title secondary-prevention-desc">
  <title id="secondary-prevention-title">預防再次中風四條防線</title>
  <desc id="secondary-prevention-desc">病因、藥物、風險管理與回診警訊的二級預防。</desc>
  <rect width="1200" height="675" fill="#fffaf3"/>
  <rect width="18" height="675" fill="#f58a1f"/>
  <text x="64" y="62" fill="#f58a1f" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="18" font-weight="850">PREVENT ANOTHER STROKE</text>
  <text x="64" y="112" fill="#3c1f0b" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="38" font-weight="900">先找病因，再把治療變成不漏接的日常</text>
  <text x="64" y="151" fill="#725b4c" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="20" font-weight="650">每次回診都確認目前病因、藥物、檢查與生活目標是否需要更新。</text>
  <g>
    <rect x="64" y="224" width="250" height="300" rx="8" fill="#ffffff" stroke="#ead8bf" stroke-width="2"/>
    <rect x="64" y="224" width="8" height="300" rx="4" fill="#f58a1f"/>
    <circle cx="106" cy="266" r="23" fill="#fff0de"/>
    <text x="106" y="274" text-anchor="middle" fill="#f58a1f" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="17" font-weight="900">01</text>
    <text x="142" y="263" text-anchor="start" fill="#3c1f0b" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="20" font-weight="900"><tspan x="142" dy="0">確認病因</tspan></text>
    <text x="88" y="318" text-anchor="start" fill="#725b4c" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="16" font-weight="700"><tspan x="88" dy="0">血管、心律、小血管或其他</tspan><tspan x="88" dy="24">原因</tspan></text>
  </g><line x1="317" y1="374" x2="334" y2="374" stroke="#f58a1f" stroke-width="4" stroke-linecap="round"/><polygon points="334,374 321,366 321,382" fill="#f58a1f"/><g>
    <rect x="338" y="224" width="250" height="300" rx="8" fill="#ffffff" stroke="#ead8bf" stroke-width="2"/>
    <rect x="338" y="224" width="8" height="300" rx="4" fill="#1595a8"/>
    <circle cx="380" cy="266" r="23" fill="#e7f6f8"/>
    <text x="380" y="274" text-anchor="middle" fill="#1595a8" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="17" font-weight="900">02</text>
    <text x="416" y="263" text-anchor="start" fill="#3c1f0b" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="20" font-weight="900"><tspan x="416" dy="0">用藥正確</tspan></text>
    <text x="362" y="318" text-anchor="start" fill="#725b4c" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="16" font-weight="700"><tspan x="362" dy="0">抗血小板或抗凝依病因選擇</tspan></text>
  </g><line x1="591" y1="374" x2="608" y2="374" stroke="#1595a8" stroke-width="4" stroke-linecap="round"/><polygon points="608,374 595,366 595,382" fill="#1595a8"/><g>
    <rect x="612" y="224" width="250" height="300" rx="8" fill="#ffffff" stroke="#ead8bf" stroke-width="2"/>
    <rect x="612" y="224" width="8" height="300" rx="4" fill="#758d60"/>
    <circle cx="654" cy="266" r="23" fill="#eef4e9"/>
    <text x="654" y="274" text-anchor="middle" fill="#758d60" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="17" font-weight="900">03</text>
    <text x="690" y="263" text-anchor="start" fill="#3c1f0b" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="20" font-weight="900"><tspan x="690" dy="0">管理風險</tspan></text>
    <text x="636" y="318" text-anchor="start" fill="#725b4c" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="16" font-weight="700"><tspan x="636" dy="0">血壓、血糖、血脂、戒菸與</tspan><tspan x="636" dy="24">睡眠</tspan></text>
  </g><line x1="865" y1="374" x2="882" y2="374" stroke="#758d60" stroke-width="4" stroke-linecap="round"/><polygon points="882,374 869,366 869,382" fill="#758d60"/><g>
    <rect x="886" y="224" width="250" height="300" rx="8" fill="#ffffff" stroke="#ead8bf" stroke-width="2"/>
    <rect x="886" y="224" width="8" height="300" rx="4" fill="#4f77a8"/>
    <circle cx="928" cy="266" r="23" fill="#eaf1fa"/>
    <text x="928" y="274" text-anchor="middle" fill="#4f77a8" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="17" font-weight="900">04</text>
    <text x="964" y="263" text-anchor="start" fill="#3c1f0b" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="20" font-weight="900"><tspan x="964" dy="0">完成追蹤</tspan></text>
    <text x="910" y="318" text-anchor="start" fill="#725b4c" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="16" font-weight="700"><tspan x="910" dy="0">檢查、回診、復健與唯一藥</tspan><tspan x="910" dy="24">單</tspan></text>
  </g>
  <line x1="64" y1="620" x2="1136" y2="620" stroke="#ead8bf" stroke-width="2"/>
  <text x="64" y="650" fill="#725b4c" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="16" font-weight="650">任何新神經症狀立刻打 119；不要自行停藥、加倍或加入阿斯匹靈。</text>
</svg>