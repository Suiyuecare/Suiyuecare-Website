<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="stroke-types-title stroke-types-desc">
  <title id="stroke-types-title">缺血性與出血性中風比較</title>
  <desc id="stroke-types-desc">比較血管阻塞與血管破裂的原因、影像和治療方向。</desc>
  <rect width="1200" height="675" fill="#fffaf3"/>
  <rect width="18" height="675" fill="#f58a1f"/>
  <text x="64" y="62" fill="#f58a1f" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="18" font-weight="850">TWO STROKE TYPES</text>
  <text x="64" y="112" fill="#3c1f0b" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="38" font-weight="900">症狀可能相似，治療方向完全不同</text>
  <text x="64" y="151" fill="#725b4c" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="20" font-weight="650">家中無法靠症狀分型；先做腦部影像，再由中風團隊決定治療。</text>
  <rect x="64" y="205" width="510" height="374" rx="8" fill="#e7f6f8" stroke="#1595a8" stroke-width="2"/>
    <text x="319" y="255" text-anchor="middle" fill="#1595a8" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="27" font-weight="900">缺血性中風｜血管堵塞</text>
    <rect x="92" y="286" width="454" height="66" rx="8" fill="#ffffff"/><text x="114" y="314" text-anchor="start" fill="#3c1f0b" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="17" font-weight="800"><tspan x="114" dy="0">腦部血流中斷</tspan></text><rect x="92" y="372" width="454" height="66" rx="8" fill="#ffffff"/><text x="114" y="400" text-anchor="start" fill="#3c1f0b" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="17" font-weight="800"><tspan x="114" dy="0">CT 先排除出血，必要時 MRI／血管影像</tspan></text><rect x="92" y="458" width="454" height="66" rx="8" fill="#ffffff"/><text x="114" y="486" text-anchor="start" fill="#3c1f0b" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="17" font-weight="800"><tspan x="114" dy="0">特定患者可評估溶栓或取栓</tspan></text><rect x="626" y="205" width="510" height="374" rx="8" fill="#fce9e4" stroke="#d95f45" stroke-width="2"/>
    <text x="881" y="255" text-anchor="middle" fill="#d95f45" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="27" font-weight="900">出血性中風｜血管破裂</text>
    <rect x="654" y="286" width="454" height="66" rx="8" fill="#ffffff"/><text x="676" y="314" text-anchor="start" fill="#3c1f0b" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="17" font-weight="800"><tspan x="676" dy="0">血液進入腦組織或周邊</tspan></text><rect x="654" y="372" width="454" height="66" rx="8" fill="#ffffff"/><text x="676" y="400" text-anchor="start" fill="#3c1f0b" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="17" font-weight="800"><tspan x="676" dy="0">CT 通常可快速看見出血</tspan></text><rect x="654" y="458" width="454" height="66" rx="8" fill="#ffffff"/><text x="676" y="486" text-anchor="start" fill="#3c1f0b" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="17" font-weight="800"><tspan x="676" dy="0">控制擴大、逆轉抗凝、必要時手術評估</tspan></text>
  <line x1="64" y1="620" x2="1136" y2="620" stroke="#ead8bf" stroke-width="2"/>
  <text x="64" y="650" fill="#725b4c" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="16" font-weight="650">疑似中風先打 119；未確認類型前，不自行吃阿斯匹靈或停用原藥。</text>
</svg>