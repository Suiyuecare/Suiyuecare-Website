<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="cardiometabolic-brain-title cardiometabolic-brain-desc">
  <title id="cardiometabolic-brain-title">三高與腦健康路徑</title>
  <desc id="cardiometabolic-brain-desc">說明血壓、血糖與膽固醇透過血管與心腦血管事件影響腦健康，並列出可行管理步驟。</desc>
  <rect width="1200" height="675" fill="#fffaf3"/>
  <rect x="0" y="0" width="18" height="675" fill="#f58a1f"/>
  <text x="64" y="66" fill="#f58a1f" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="18" font-weight="800" letter-spacing="2">HEART–BRAIN CONNECTION</text>
  <text x="64" y="118" fill="#3c1f0b" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="38" font-weight="900">顧好血管，就是替大腦保留空間</text>
  <text x="64" y="154" fill="#725b4c" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="20" font-weight="650">不是追求一個人人相同的數字，而是規律測量、就醫與持續管理。</text>
  <g>
    <rect x="64" y="210" width="230" height="112" rx="8" fill="#ffffff" stroke="#ead8bf" stroke-width="2"/>
    <rect x="64" y="210" width="8" height="112" rx="4" fill="#db6547"/>
    <rect x="88" y="232" width="44" height="32" rx="8" fill="#fcebe6"/><text x="110" y="255" fill="#db6547" text-anchor="middle" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="16" font-weight="900">01</text>
    <text x="146" y="257" fill="#3c1f0b" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="22" font-weight="900">血壓</text>
    <text x="90" y="292" fill="#725b4c" text-anchor="start" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="17" font-weight="700"><tspan x="90" dy="0">長期過高會增加</tspan><tspan x="90" dy="25">血管負擔</tspan></text>
  </g>
  <g>
    <rect x="64" y="350" width="230" height="112" rx="8" fill="#ffffff" stroke="#ead8bf" stroke-width="2"/>
    <rect x="64" y="350" width="8" height="112" rx="4" fill="#f58a1f"/>
    <rect x="88" y="372" width="44" height="32" rx="8" fill="#fff0de"/><text x="110" y="395" fill="#f58a1f" text-anchor="middle" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="16" font-weight="900">02</text>
    <text x="146" y="397" fill="#3c1f0b" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="22" font-weight="900">血糖</text>
    <text x="90" y="432" fill="#725b4c" text-anchor="start" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="17" font-weight="700"><tspan x="90" dy="0">忽高忽低也會</tspan><tspan x="90" dy="25">影響全身血管</tspan></text>
  </g>
  <g>
    <rect x="64" y="490" width="230" height="112" rx="8" fill="#ffffff" stroke="#ead8bf" stroke-width="2"/>
    <rect x="64" y="490" width="8" height="112" rx="4" fill="#d89e2b"/>
    <rect x="88" y="512" width="44" height="32" rx="8" fill="#fff6d9"/><text x="110" y="535" fill="#d89e2b" text-anchor="middle" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="16" font-weight="900">03</text>
    <text x="146" y="537" fill="#3c1f0b" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="22" font-weight="900">血脂</text>
    <text x="90" y="572" fill="#725b4c" text-anchor="start" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="17" font-weight="700"><tspan x="90" dy="0">依整體風險設定</tspan><tspan x="90" dy="25">治療目標</tspan></text>
  </g>
  <line x1="315" y1="405" x2="425" y2="405" stroke="#f58a1f" stroke-width="4" stroke-linecap="round"/>
  <polygon points="425,405 416.33974596215563,410 416.33974596215563,400" fill="#f58a1f"/>
  <rect x="445" y="258" width="290" height="294" rx="8" fill="#ffffff" stroke="#ead8bf" stroke-width="2"/>
  <text x="590" y="312" text-anchor="middle" fill="#3c1f0b" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="26" font-weight="900">共同影響：血管健康</text>
  <text x="590" y="360" fill="#725b4c" text-anchor="middle" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="19" font-weight="750"><tspan x="590" dy="0">小血管受損</tspan><tspan x="590" dy="43">中風與心血管事件</tspan><tspan x="590" dy="43">腦部供血與復原能力</tspan></text>
  <line x1="755" y1="405" x2="850" y2="405" stroke="#1595a8" stroke-width="4" stroke-linecap="round"/>
  <polygon points="850,405 841.3397459621556,410 841.3397459621556,400" fill="#1595a8"/>
  <rect x="870" y="225" width="266" height="360" rx="8" fill="#e7f6f8" stroke="#1595a8" stroke-width="2"/>
  <text x="1003" y="278" text-anchor="middle" fill="#1595a8" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="25" font-weight="900">家庭管理四步驟</text>
  <text x="920" y="330" fill="#3c1f0b" text-anchor="start" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="19" font-weight="800"><tspan x="920" dy="0">1  固定時間測量</tspan><tspan x="920" dy="52">2  帶紀錄回診</tspan><tspan x="920" dy="52">3  按醫囑用藥</tspan><tspan x="920" dy="52">4  活動、飲食、睡眠一起顧</tspan></text>
  
  <line x1="64" y1="620" x2="1136" y2="620" stroke="#ead8bf" stroke-width="2"/>
  <text x="64" y="650" fill="#725b4c" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="16" font-weight="650">血壓、血糖與血脂目標需依年齡、共病與用藥個別設定；勿自行停藥或追求過低數值。</text>
</svg>