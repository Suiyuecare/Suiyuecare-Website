<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="hearing-connection-title hearing-connection-desc">
  <title id="hearing-connection-title">聽力與認知連結</title>
  <desc id="hearing-connection-desc">呈現聽不清楚可能增加溝通負荷與社交退縮，並說明從觀察到評估的處理流程。</desc>
  <rect width="1200" height="675" fill="#fffaf3"/>
  <rect x="0" y="0" width="18" height="675" fill="#f58a1f"/>
  <text x="64" y="66" fill="#f58a1f" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="18" font-weight="800" letter-spacing="2">HEARING &amp; CONNECTION</text>
  <text x="64" y="118" fill="#3c1f0b" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="38" font-weight="900">聽不清，不只是把音量調大</text>
  <text x="64" y="154" fill="#725b4c" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="20" font-weight="650">先排除耳垢與疾病，再評估聽力、輔具與溝通環境。</text>
  <g>
    <rect x="64" y="230" width="230" height="175" rx="8" fill="#ffffff" stroke="#ead8bf" stroke-width="2"/>
    <rect x="64" y="230" width="8" height="175" rx="4" fill="#f58a1f"/>
    <rect x="88" y="252" width="44" height="32" rx="8" fill="#fff0de"/><text x="110" y="275" fill="#f58a1f" text-anchor="middle" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="16" font-weight="900">01</text>
    <text x="146" y="277" fill="#3c1f0b" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="22" font-weight="900">聽不清楚</text>
    <text x="90" y="312" fill="#725b4c" text-anchor="start" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="17" font-weight="700"><tspan x="90" dy="0">常請人重說</tspan><tspan x="90" dy="25">電視越開越大</tspan></text>
  </g>
  <line x1="312" y1="318" x2="402" y2="318" stroke="#f58a1f" stroke-width="4" stroke-linecap="round"/>
  <polygon points="402,318 393.33974596215563,323 393.33974596215563,313" fill="#f58a1f"/>
  <g>
    <rect x="420" y="230" width="230" height="175" rx="8" fill="#ffffff" stroke="#ead8bf" stroke-width="2"/>
    <rect x="420" y="230" width="8" height="175" rx="4" fill="#1595a8"/>
    <rect x="444" y="252" width="44" height="32" rx="8" fill="#e7f6f8"/><text x="466" y="275" fill="#1595a8" text-anchor="middle" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="16" font-weight="900">02</text>
    <text x="502" y="277" fill="#3c1f0b" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="22" font-weight="900">溝通更費力</text>
    <text x="446" y="312" fill="#725b4c" text-anchor="start" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="17" font-weight="700"><tspan x="446" dy="0">要猜語意</tspan><tspan x="446" dy="25">容易疲累與誤會</tspan></text>
  </g>
  <line x1="668" y1="318" x2="758" y2="318" stroke="#1595a8" stroke-width="4" stroke-linecap="round"/>
  <polygon points="758,318 749.3397459621556,323 749.3397459621556,313" fill="#1595a8"/>
  <g>
    <rect x="776" y="230" width="230" height="175" rx="8" fill="#ffffff" stroke="#ead8bf" stroke-width="2"/>
    <rect x="776" y="230" width="8" height="175" rx="4" fill="#758d60"/>
    <rect x="800" y="252" width="44" height="32" rx="8" fill="#eef4e9"/><text x="822" y="275" fill="#758d60" text-anchor="middle" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="16" font-weight="900">03</text>
    <text x="858" y="277" fill="#3c1f0b" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="22" font-weight="900">減少互動</text>
    <text x="802" y="312" fill="#725b4c" text-anchor="start" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="17" font-weight="700"><tspan x="802" dy="0">少參與對話</tspan><tspan x="802" dy="25">可能逐漸退縮</tspan></text>
  </g>
  <path d="M890 422 C890 520 185 520 185 422" fill="none" stroke="#ead8bf" stroke-width="4" stroke-dasharray="8 8"/>
  <rect x="64" y="475" width="240" height="40" rx="8" fill="#fff0de" stroke="#f58a1f" stroke-width="1.5"/>
  <text x="184" y="502" fill="#f58a1f" text-anchor="middle" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="17" font-weight="850">先看耳鼻喉／聽力評估</text>
  <rect x="326" y="475" width="234" height="40" rx="8" fill="#e7f6f8" stroke="#1595a8" stroke-width="1.5"/>
  <text x="443" y="502" fill="#1595a8" text-anchor="middle" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="17" font-weight="850">需要時試配與追蹤</text>
  <rect x="582" y="475" width="250" height="40" rx="8" fill="#eef4e9" stroke="#758d60" stroke-width="1.5"/>
  <text x="707" y="502" fill="#758d60" text-anchor="middle" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="17" font-weight="850">面對面、慢一點說</text>
  <rect x="854" y="475" width="282" height="40" rx="8" fill="#eaf1fa" stroke="#4f77a8" stroke-width="1.5"/>
  <text x="995" y="502" fill="#4f77a8" text-anchor="middle" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="17" font-weight="850">降低背景噪音、保持互動</text>
  
  <line x1="64" y1="620" x2="1136" y2="620" stroke="#ead8bf" stroke-width="2"/>
  <text x="64" y="650" fill="#725b4c" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="16" font-weight="650">研究並未證明助聽器對所有人都能防失智；但改善聽見、溝通與參與，本身就很重要。</text>
</svg>