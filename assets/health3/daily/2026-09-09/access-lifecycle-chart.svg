<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">長照系統帳號權限四個生命週期節點</title>
  <desc id="desc">從開通、異動、定期複核到停用的定性流程，每一步都指定提出人、核准人、完成時間與稽核證據。</desc>
  <rect width="1200" height="675" fill="#fffaf3"/>
  <text x="72" y="84" font-size="38" font-weight="700" fill="#3c1f0b" font-family="sans-serif">權限不是開一次就結束</text>
  <text x="72" y="126" font-size="22" fill="#725b4c" font-family="sans-serif">四個節點都要回答：誰需要、能做什麼、何時再確認</text>
  <path d="M160 310 H1040" stroke="#ead8bf" stroke-width="18" stroke-linecap="round"/>
  <g font-family="sans-serif" text-anchor="middle">
    <circle cx="180" cy="310" r="74" fill="#f58a1f"/><text x="180" y="304" font-size="30" font-weight="700" fill="white">開通</text><text x="180" y="342" font-size="18" fill="white">依職務核准</text>
    <circle cx="460" cy="310" r="74" fill="#1595a8"/><text x="460" y="304" font-size="30" font-weight="700" fill="white">異動</text><text x="460" y="342" font-size="18" fill="white">角色隨即調整</text>
    <circle cx="740" cy="310" r="74" fill="#758d60"/><text x="740" y="304" font-size="30" font-weight="700" fill="white">複核</text><text x="740" y="342" font-size="18" fill="white">逐人逐權限</text>
    <circle cx="1020" cy="310" r="74" fill="#d95f45"/><text x="1020" y="304" font-size="30" font-weight="700" fill="white">停用</text><text x="1020" y="342" font-size="18" fill="white">交接同步收回</text>
  </g>
  <rect x="126" y="454" width="948" height="126" rx="24" fill="#ead8bf" opacity=".55"/>
  <text x="600" y="505" text-anchor="middle" font-size="26" font-weight="700" fill="#3c1f0b" font-family="sans-serif">每一步留下可核對的最小證據</text>
  <text x="600" y="548" text-anchor="middle" font-size="22" fill="#725b4c" font-family="sans-serif">申請來源・核准角色・生效時間・完成結果・例外處理</text>
</svg>
