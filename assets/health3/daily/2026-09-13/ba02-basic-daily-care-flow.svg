<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">BA02 基本日常照顧五欄安排圖</title>
  <desc id="desc">依序確認長者能力、核定任務、每三十分鐘時間單位、安全風險與服務紀錄；一日限三小時且不得與其他組合併用。</desc>
  <rect width="1200" height="675" rx="36" fill="#fffaf3"/>
  <text x="68" y="88" font-family="sans-serif" font-size="42" font-weight="700" fill="#3c1f0b">BA02 基本日常照顧｜五欄排出真正需要</text>
  <text x="68" y="130" font-family="sans-serif" font-size="22" fill="#725b4c">從能力開始，不用「全部代做」衡量服務</text>
  <g font-family="sans-serif">
    <g transform="translate(70 180)"><rect width="1060" height="72" rx="18" fill="#ead8bf"/><circle cx="45" cy="36" r="25" fill="#f58a1f"/><text x="45" y="45" text-anchor="middle" font-size="24" font-weight="700" fill="#fffaf3">1</text><text x="92" y="44" font-size="27" font-weight="700" fill="#3c1f0b">能力</text><text x="260" y="44" font-size="22" fill="#3c1f0b">本人能做、需要提示、需要動作協助</text></g>
    <g transform="translate(70 267)"><rect width="1060" height="72" rx="18" fill="#dcebea"/><circle cx="45" cy="36" r="25" fill="#1595a8"/><text x="45" y="45" text-anchor="middle" font-size="24" font-weight="700" fill="#fffaf3">2</text><text x="92" y="44" font-size="27" font-weight="700" fill="#3c1f0b">任務</text><text x="260" y="44" font-size="22" fill="#3c1f0b">只做照顧計畫核定的日常生活協助</text></g>
    <g transform="translate(70 354)"><rect width="1060" height="72" rx="18" fill="#e5eadf"/><circle cx="45" cy="36" r="25" fill="#758d60"/><text x="45" y="45" text-anchor="middle" font-size="24" font-weight="700" fill="#fffaf3">3</text><text x="92" y="44" font-size="27" font-weight="700" fill="#3c1f0b">時間</text><text x="260" y="44" font-size="22" fill="#3c1f0b">每 30 分鐘一單位；一日限三小時</text></g>
    <g transform="translate(70 441)"><rect width="1060" height="72" rx="18" fill="#e1e7f0"/><circle cx="45" cy="36" r="25" fill="#4f77a8"/><text x="45" y="45" text-anchor="middle" font-size="24" font-weight="700" fill="#fffaf3">4</text><text x="92" y="44" font-size="27" font-weight="700" fill="#3c1f0b">安全</text><text x="260" y="44" font-size="22" fill="#3c1f0b">移位、跌倒、疼痛、吞嚥與用藥界線</text></g>
    <g transform="translate(70 528)"><rect width="1060" height="72" rx="18" fill="#f2ddd7"/><circle cx="45" cy="36" r="25" fill="#d95f45"/><text x="45" y="45" text-anchor="middle" font-size="24" font-weight="700" fill="#fffaf3">5</text><text x="92" y="44" font-size="27" font-weight="700" fill="#3c1f0b">紀錄</text><text x="260" y="44" font-size="22" fill="#3c1f0b">完成內容、參與程度、異常與通知對象</text></g>
  </g>
  <text x="600" y="642" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#725b4c">附表四：BA02 不得與其他組合併用｜查核日 2026-09-13</text>
</svg>
