<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">帕金森氏症起身頭暈的安全流程</title><desc id="desc">出現頭暈先坐回，確認急症警訊，記錄姿勢與症狀，交由專業團隊評估治療，再追蹤安全。</desc><rect width="1200" height="675" rx="36" fill="#fffaf3"/><text x="70" y="90" font-size="42" font-weight="700" fill="#3c1f0b">起身頭暈：先保住安全，再找原因</text><text x="70" y="135" font-size="24" fill="#725b4c">定性流程｜不要為了量到站立血壓勉強站著</text>
  <g font-family="sans-serif" text-anchor="middle"><circle cx="145" cy="330" r="92" fill="#d95f45"/><circle cx="370" cy="330" r="92" fill="#f58a1f"/><circle cx="600" cy="330" r="92" fill="#1595a8"/><circle cx="830" cy="330" r="92" fill="#758d60"/><circle cx="1055" cy="330" r="92" fill="#4f77a8"/>
  <g fill="#fff" font-size="27" font-weight="700"><text x="145" y="320"><tspan x="145">暈就坐回</tspan><tspan x="145" dy="34">或躺下</tspan></text><text x="370" y="320"><tspan x="370">看急症</tspan><tspan x="370" dy="34">警訊</tspan></text><text x="600" y="320"><tspan x="600">記姿勢</tspan><tspan x="600" dy="34">症狀與時間</tspan></text><text x="830" y="320"><tspan x="830">專業評估</tspan><tspan x="830" dy="34">分階段治療</tspan></text><text x="1055" y="320"><tspan x="1055">追蹤跌倒</tspan><tspan x="1055" dy="34">與生活</tspan></text></g></g>
  <path d="M237 330h41m184 0h46m184 0h46m184 0h41" stroke="#3c1f0b" stroke-width="9"/><rect x="130" y="505" width="940" height="92" rx="22" fill="#ead8bf"/><text x="600" y="545" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#3c1f0b">胸痛、呼吸困難、新單側無力／說話不清、持續昏厥</text><text x="600" y="578" text-anchor="middle" font-family="sans-serif" font-size="23" fill="#3c1f0b">立即撥 119，不做居家反覆站立測試</text>
</svg>
