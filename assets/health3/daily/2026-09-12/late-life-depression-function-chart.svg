<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">老年憂鬱功能改變照顧流程</title><desc id="desc">看見生活差異後，直接詢問安全，接受完整評估，共同選擇治療，再追蹤功能與風險。</desc>
  <rect width="1200" height="675" rx="36" fill="#fffaf3"/><text x="70" y="92" font-size="42" font-weight="700" fill="#3c1f0b">不是只問心情：把功能改變帶進評估</text><text x="70" y="135" font-size="24" fill="#725b4c">定性照顧流程｜篩檢不等於診斷</text>
  <g font-family="sans-serif" text-anchor="middle"><g fill="#f58a1f"><rect x="55" y="220" width="190" height="210" rx="24"/><rect x="280" y="220" width="190" height="210" rx="24" fill="#d95f45"/><rect x="505" y="220" width="190" height="210" rx="24" fill="#1595a8"/><rect x="730" y="220" width="190" height="210" rx="24" fill="#758d60"/><rect x="955" y="220" width="190" height="210" rx="24" fill="#4f77a8"/></g>
  <g fill="#fff" font-size="29" font-weight="700"><text x="150" y="285">看見差異</text><text x="375" y="285">直接問安全</text><text x="600" y="285">完整評估</text><text x="825" y="285">共同治療</text><text x="1050" y="285">追蹤功能</text></g>
  <g fill="#fff" font-size="21"><text x="150" y="335"><tspan x="150">睡眠、食量</tspan><tspan x="150" dy="30">興趣、生活任務</tspan></text><text x="375" y="335"><tspan x="375">想死或自傷？</tspan><tspan x="375" dy="30">有方法與時間？</tspan></text><text x="600" y="335"><tspan x="600">病程、共病</tspan><tspan x="600" dy="30">藥物、認知、功能</tspan></text><text x="825" y="335"><tspan x="825">心理、藥物</tspan><tspan x="825" dy="30">社會與日常支持</tspan></text><text x="1050" y="335"><tspan x="1050">安全、反應</tspan><tspan x="1050" dy="30">回診與家庭負荷</tspan></text></g></g>
  <path d="M245 325h35m190 0h35m190 0h35m190 0h35" stroke="#3c1f0b" stroke-width="8"/><rect x="70" y="505" width="1060" height="100" rx="22" fill="#ead8bf"/><text x="600" y="548" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#3c1f0b">有立即自傷危險、已自傷或無法維持安全</text><text x="600" y="582" text-anchor="middle" font-family="sans-serif" font-size="23" fill="#3c1f0b">不等待一般流程：陪在身邊，撥 119／前往急診；1925 可提供 24 小時心理支持</text>
</svg>
