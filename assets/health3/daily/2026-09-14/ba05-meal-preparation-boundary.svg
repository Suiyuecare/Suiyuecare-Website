<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">BA05 餐食照顧與 BA04 的服務界線</title>
  <desc id="desc">BA05 包含在案家現場備餐或準備一日自製管灌飲食；單純加熱、擺盤與非自製管灌飲食歸入 BA04。</desc>
  <rect width="1200" height="675" fill="#fffaf4"/>
  <text x="70" y="86" font-family="system-ui, sans-serif" font-size="42" font-weight="700" fill="#402f25">BA05 看的是「備餐」，不是每次碰到食物都算</text>
  <text x="70" y="130" font-family="system-ui, sans-serif" font-size="23" fill="#705a4a">先用實際工作內容分流，再依核定照顧計畫執行</text>
  <g font-family="system-ui, sans-serif">
    <rect x="70" y="190" width="505" height="345" rx="28" fill="#fff" stroke="#e66f26" stroke-width="5"/>
    <rect x="70" y="190" width="505" height="78" rx="28" fill="#e66f26"/>
    <text x="322" y="240" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">BA05 餐食照顧</text>
    <circle cx="125" cy="328" r="14" fill="#e66f26"/><text x="158" y="337" font-size="25" font-weight="700" fill="#402f25">在案家現場備餐與善後</text>
    <text x="158" y="375" font-size="21" fill="#705a4a">依本人需要準備一餐，一次備餐一組</text>
    <circle cx="125" cy="439" r="14" fill="#e66f26"/><text x="158" y="448" font-size="25" font-weight="700" fill="#402f25">一日自製管灌飲食與善後</text>
    <text x="158" y="486" font-size="21" fill="#705a4a">依既定營養與管灌計畫準備</text>
    <rect x="625" y="190" width="505" height="345" rx="28" fill="#fff" stroke="#6c7a89" stroke-width="5"/>
    <rect x="625" y="190" width="505" height="78" rx="28" fill="#6c7a89"/>
    <text x="877" y="240" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">這些屬 BA04 的範圍</text>
    <circle cx="680" cy="328" r="14" fill="#6c7a89"/><text x="713" y="337" font-size="25" font-weight="700" fill="#402f25">單純加熱、擺盤與餐後清理</text>
    <text x="713" y="375" font-size="21" fill="#705a4a">沒有現場烹調備餐時，不另算 BA05</text>
    <circle cx="680" cy="439" r="14" fill="#6c7a89"/><text x="713" y="448" font-size="25" font-weight="700" fill="#402f25">非自製管灌品或奶類的餵食</text>
    <text x="713" y="486" font-size="21" fill="#705a4a">協助餵食、觀察與善後按 BA04 核定</text>
  </g>
  <rect x="160" y="572" width="880" height="68" rx="18" fill="#49372d"/>
  <text x="600" y="615" text-anchor="middle" font-family="system-ui, sans-serif" font-size="23" font-weight="700" fill="#fff">同住多人共用一份備餐時，先向個案管理員確認額度與部分負擔歸屬</text>
</svg>
