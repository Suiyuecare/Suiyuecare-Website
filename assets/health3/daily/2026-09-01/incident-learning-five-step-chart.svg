<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">長照異常事件五步學習迴圈</title>
  <desc id="desc">事件發生後先照顧人，再重建事實、分析系統條件、設計可執行改善並追蹤是否真正落地的流程。</desc>
  <rect width="1200" height="675" rx="34" fill="#fffaf3"/>
  <text x="70" y="82" font-family="system-ui, sans-serif" font-size="38" font-weight="700" fill="#3c1f0b">異常事件後，會議要完成的五件事</text>
  <text x="70" y="124" font-family="system-ui, sans-serif" font-size="21" fill="#725b4c">不淡化責任，也不把「某人更小心」當成唯一改善</text>
  <g font-family="system-ui, sans-serif">
    <g transform="translate(70 180)"><rect width="190" height="250" rx="24" fill="#f6e1d8"/><circle cx="95" cy="56" r="34" fill="#d95f45"/><text x="95" y="65" text-anchor="middle" font-size="30" font-weight="700" fill="white">1</text><text x="95" y="120" text-anchor="middle" font-size="25" font-weight="700" fill="#3c1f0b">先照顧人</text><text x="95" y="160" text-anchor="middle" font-size="18" fill="#725b4c">服務對象、家屬</text><text x="95" y="190" text-anchor="middle" font-size="18" fill="#725b4c">與第一線人員</text><text x="95" y="222" text-anchor="middle" font-size="18" fill="#725b4c">先處理即時風險</text></g>
    <g transform="translate(285 180)"><rect width="190" height="250" rx="24" fill="#dce8ef"/><circle cx="95" cy="56" r="34" fill="#4f77a8"/><text x="95" y="65" text-anchor="middle" font-size="30" font-weight="700" fill="white">2</text><text x="95" y="120" text-anchor="middle" font-size="25" font-weight="700" fill="#3c1f0b">重建事實</text><text x="95" y="160" text-anchor="middle" font-size="18" fill="#725b4c">時間、環境、資訊</text><text x="95" y="190" text-anchor="middle" font-size="18" fill="#725b4c">設備與當時決策</text><text x="95" y="222" text-anchor="middle" font-size="18" fill="#725b4c">分開事實與推測</text></g>
    <g transform="translate(500 180)"><rect width="190" height="250" rx="24" fill="#e5eddf"/><circle cx="95" cy="56" r="34" fill="#758d60"/><text x="95" y="65" text-anchor="middle" font-size="30" font-weight="700" fill="white">3</text><text x="95" y="120" text-anchor="middle" font-size="25" font-weight="700" fill="#3c1f0b">找系統條件</text><text x="95" y="160" text-anchor="middle" font-size="18" fill="#725b4c">流程、交接、排班</text><text x="95" y="190" text-anchor="middle" font-size="18" fill="#725b4c">訓練與環境設計</text><text x="95" y="222" text-anchor="middle" font-size="18" fill="#725b4c">也辨識不當行為</text></g>
    <g transform="translate(715 180)"><rect width="190" height="250" rx="24" fill="#fbe4c8"/><circle cx="95" cy="56" r="34" fill="#f58a1f"/><text x="95" y="65" text-anchor="middle" font-size="30" font-weight="700" fill="white">4</text><text x="95" y="120" text-anchor="middle" font-size="25" font-weight="700" fill="#3c1f0b">設計改善</text><text x="95" y="160" text-anchor="middle" font-size="18" fill="#725b4c">指定負責人</text><text x="95" y="190" text-anchor="middle" font-size="18" fill="#725b4c">先小範圍試行</text><text x="95" y="222" text-anchor="middle" font-size="18" fill="#725b4c">避免只再宣導</text></g>
    <g transform="translate(930 180)"><rect width="190" height="250" rx="24" fill="#ead8bf"/><circle cx="95" cy="56" r="34" fill="#1595a8"/><text x="95" y="65" text-anchor="middle" font-size="30" font-weight="700" fill="white">5</text><text x="95" y="120" text-anchor="middle" font-size="25" font-weight="700" fill="#3c1f0b">追蹤落地</text><text x="95" y="160" text-anchor="middle" font-size="18" fill="#725b4c">現場抽查與回饋</text><text x="95" y="190" text-anchor="middle" font-size="18" fill="#725b4c">確認風險真下降</text><text x="95" y="222" text-anchor="middle" font-size="18" fill="#725b4c">必要時再修正</text></g>
  </g>
  <path d="M1025 465C960 590 245 590 165 465" fill="none" stroke="#1595a8" stroke-width="7" stroke-linecap="round" stroke-dasharray="13 13"/>
  <path d="m178 450-20 17 25 9" fill="none" stroke="#1595a8" stroke-width="7"/>
  <text x="595" y="536" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#1595a8">改善後仍要回到現場，讓下一次更安全</text>
  <rect x="170" y="566" width="860" height="48" rx="24" fill="#3c1f0b"/>
  <text x="600" y="598" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" fill="white">公平文化不是免責：人為疏失、冒險選擇與蓄意違規仍需依事實採取不同處理。</text>
  <text x="70" y="650" font-family="system-ui, sans-serif" font-size="15" fill="#725b4c">定性流程；依 WHO、台灣病人安全通報系統與 RCA2 原則整理。資料查核：2026-09-01。</text>
</svg>
